<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#0f766e" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="favicon-32.png" sizes="32x32" />
  <link rel="apple-touch-icon" href="apple-touch-icon-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Atlast" />
  <style>
:root { --teal:#0f766e; --teal-d:#0b5e57; --bg:#f6f7f8; --card:#fff; --ink:#16202a; --muted:#5b6b7a; --line:#e3e8ec; --ok:#15803d; --warn:#b45309; --err:#b91c1c; --chip:#eef2f4; --radius:14px; --tabbar-h:60px; }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { margin:0; padding:0; }
body { font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; background:var(--bg); color:var(--ink); padding-bottom:calc(var(--tabbar-h) + env(safe-area-inset-bottom)); }
.topbar { position:sticky; top:0; z-index:10; display:flex; align-items:center; justify-content:space-between; gap:8px; padding:calc(env(safe-area-inset-top) + 10px) 14px 10px; background:var(--teal); color:#fff; box-shadow:0 1px 0 rgba(0,0,0,.06); }
.topbar-title { font-weight:600; font-size:18px; }
.topbar-actions { display:flex; align-items:center; gap:8px; }
.chip { border:0; background:rgba(255,255,255,.16); color:#fff; padding:6px 10px; border-radius:999px; font-size:13px; cursor:pointer; }
.cogbtn { width:34px; height:34px; border-radius:50%; border:0; background:#fff; color:var(--teal-d); display:flex; align-items:center; justify-content:center; cursor:pointer; padding:0; -webkit-tap-highlight-color:transparent; }
.cogbtn svg { width:19px; height:19px; }
.datettl { display:inline-flex; align-items:center; gap:6px; background:transparent; border:0; color:#fff; font:inherit; font-weight:600; font-size:18px; cursor:pointer; padding:0; -webkit-tap-highlight-color:transparent; }
.datettl svg { width:19px; height:19px; flex:0 0 auto; }
.datettl .dtchev { font-size:12px; opacity:.85; transition:transform .15s; }
.datettl .dtchev.up { transform:rotate(180deg); }
.lang-toggle { display:inline-flex; background:rgba(255,255,255,.16); border-radius:999px; padding:2px; }
.lang-btn { border:0; background:transparent; color:#fff; opacity:.8; padding:5px 12px; border-radius:999px; font-weight:600; font-size:13px; cursor:pointer; }
.lang-btn.is-active { background:#fff; color:var(--teal); opacity:1; }
.status-strip { font-size:13px; padding:8px 14px; background:#fff8e1; color:var(--warn); border-bottom:1px solid var(--line); }
.status-strip.ok { background:#ecfdf3; color:var(--ok); }
.status-strip.err { background:#fef2f2; color:var(--err); }
.screen { padding:14px; max-width:720px; margin:0 auto; }
.card { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:14px; margin-bottom:12px; }
.card h2 { font-size:15px; margin:0 0 10px; }
.muted { color:var(--muted); } .small { font-size:13px; }
.placeholder { text-align:center; color:var(--muted); padding:36px 12px; } .placeholder .big { font-size:40px; margin-bottom:8px; }
.grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
.stat { background:var(--chip); border-radius:12px; padding:10px; text-align:center; }
.stat .n { font-size:22px; font-weight:700; color:var(--teal-d); } .stat .k { font-size:11px; color:var(--muted); text-transform:uppercase; }
.kv { display:flex; justify-content:space-between; gap:10px; padding:5px 0; border-bottom:1px dashed var(--line); }
.kv:last-child { border-bottom:0; } .kv .k { color:var(--muted); } .kv .v { font-weight:600; text-align:right; }
.badge { display:inline-block; font-size:12px; font-weight:700; padding:2px 8px; border-radius:999px; white-space:nowrap; }
.badge.ok { background:#dcfce7; color:var(--ok); } .badge.err { background:#fee2e2; color:var(--err); }
details.msgs { margin-top:8px; } details.msgs summary { cursor:pointer; font-size:13px; color:var(--muted); }
.msglist { margin:8px 0 0; padding:0; list-style:none; font-size:12.5px; } .msglist li { padding:4px 0; border-bottom:1px solid var(--line); color:var(--muted); }
.chips-row { display:flex; flex-wrap:wrap; gap:6px; } .pill { font-size:12px; background:var(--chip); border-radius:999px; padding:4px 10px; color:var(--ink); }
.tabbar { position:fixed; left:0; right:0; bottom:0; z-index:10; height:calc(var(--tabbar-h) + env(safe-area-inset-bottom)); padding-bottom:env(safe-area-inset-bottom); display:grid; grid-template-columns:repeat(5,1fr); background:#fff; border-top:1px solid var(--line); }
.tab { border:0; background:transparent; cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; color:var(--muted); font-size:11px; }
.tab .tab-ico { font-size:20px; line-height:1; } .tab.is-active { color:var(--teal); font-weight:600; }
.btn { border:0; background:var(--teal); color:#fff; border-radius:10px; padding:10px 14px; font-size:14px; font-weight:600; cursor:pointer; touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
.btn.ghost { background:var(--chip); color:var(--ink); } .btn.wide { width:100%; }
.btn-sm { border:1px solid var(--line); background:#fff; color:var(--err); border-radius:8px; padding:5px 10px; font-size:13px; cursor:pointer; }
.subhead { font-size:12px; text-transform:uppercase; letter-spacing:.03em; color:var(--muted); margin:10px 0 6px; }
.saved-tag { text-align:center; padding:4px; } h2 .small { font-weight:400; text-transform:none; }
.daynav { display:flex; align-items:center; justify-content:space-between; gap:10px; } .daynav .dayname { text-align:center; flex:1; }
.daynav input[type="date"] { border:0; font-size:16px; font-weight:600; color:var(--ink); background:transparent; text-align:center; }
.navbtn { border:0; background:var(--chip); width:40px; height:40px; border-radius:50%; font-size:22px; color:var(--teal-d); cursor:pointer; } .navbtn:disabled { opacity:.35; }
.sym { padding:8px 0; border-bottom:1px solid var(--line); } .sym:last-child { border-bottom:0; } .sym.loc { padding-left:6px; }
.sym-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; } .sym-head.expandable { cursor:pointer; }
.sym-name { font-weight:600; } .located .loc-list { border-left:3px solid var(--chip); padding-left:10px; margin-top:4px; }
.sev-row { display:grid; grid-template-columns:repeat(5,1fr); gap:6px; }
.sev { border:1px solid var(--line); background:#fff; color:var(--muted); border-radius:9px; padding:9px 0; font-size:15px; font-weight:700; cursor:pointer; touch-action:manipulation; -webkit-tap-highlight-color:transparent; user-select:none; }
.sev.is-on { color:#fff; border-color:transparent; }
.sev-0.is-on,.sev-chip.sev-0 { background:#94a3b8; color:#fff; } .sev-1.is-on,.sev-chip.sev-1 { background:#fde047; color:#422006; }
.sev-2.is-on,.sev-chip.sev-2 { background:#f59e0b; } .sev-3.is-on,.sev-chip.sev-3 { background:#f97316; } .sev-4.is-on,.sev-chip.sev-4 { background:#b91c1c; }
.sev-chip { display:inline-block; min-width:22px; text-align:center; color:#fff; border-radius:999px; padding:2px 9px; font-weight:700; font-size:13px; } .sev-chip .small { color:rgba(255,255,255,.85); }
.med { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:8px 0; border-bottom:1px solid var(--line); } .med:last-child { border-bottom:0; }
.med-name { font-weight:600; } .med-toggle { display:flex; gap:6px; }
.tgl { width:44px; height:40px; border:1px solid var(--line); background:#fff; border-radius:8px; font-size:15px; cursor:pointer; color:var(--muted); touch-action:manipulation; -webkit-tap-highlight-color:transparent; user-select:none; }
.tgl.is-yes { background:var(--ok); color:#fff; border-color:transparent; } .tgl.is-no { background:var(--err); color:#fff; border-color:transparent; }
.med-stepper { display:flex; align-items:center; gap:8px; }
.stepbtn { width:34px; height:34px; border:1px solid var(--line); background:#fff; border-radius:8px; font-size:17px; font-weight:700; line-height:1; cursor:pointer; color:var(--teal-d); touch-action:manipulation; -webkit-tap-highlight-color:transparent; user-select:none; }
.stepbtn.plus { background:var(--teal); color:#fff; border-color:transparent; }
.stepbtn:disabled { opacity:.35; cursor:default; }
.stepcount { min-width:22px; text-align:center; font-size:17px; font-weight:700; color:var(--teal-d); }
#noteBox { width:100%; border:1px solid var(--line); border-radius:10px; padding:10px; font:inherit; resize:vertical; }
.ep-ongoing { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:6px 0; }
.ep-form { display:flex; flex-direction:column; gap:8px; } .ep-form input,.ep-form select { border:1px solid var(--line); border-radius:9px; padding:9px; font:inherit; }
.ep-form-row { display:grid; grid-template-columns:1fr 1fr; gap:8px; } .ep-form-actions { display:flex; gap:8px; }
.submit-block { margin-top:12px; padding-top:12px; border-top:1px solid var(--line); } .submit-hint { text-align:center; margin-top:6px; }
.row-right { display:inline-flex; align-items:center; gap:8px; flex-shrink:0; }
.ro-fold > summary { list-style:none; cursor:pointer; display:flex; align-items:center; gap:8px; }
.ro-fold > summary::-webkit-details-marker { display:none; }
.ro-fold > summary h2 { margin:0; }
.ro-caret { margin-left:auto; color:var(--muted); font-size:13px; transition:transform .15s; }
.ro-fold[open] .ro-caret { transform:rotate(90deg); }
.ro-body { margin-top:8px; }
.notebtn { border:1px solid var(--line); background:#fff; border-radius:8px; padding:3px 8px; font-size:13px; cursor:pointer; opacity:.55; }
.notebtn.has { opacity:1; border-color:var(--teal); background:#ecfeff; }
.rownote { width:100%; margin-top:8px; border:1px solid var(--line); border-radius:9px; padding:8px 34px 8px 8px; font:inherit; font-size:14px; resize:vertical; }
.rownote-wrap { margin-top:8px; position:relative; }
.rownote-wrap .rownote { margin-top:0; }
.rownote-done { position:absolute; top:6px; right:6px; width:24px; height:24px; display:inline-flex; align-items:center; justify-content:center; border:0; background:#0f766e; color:#fff; border-radius:50%; padding:0; cursor:pointer; touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
.rownote-done:active { opacity:.85; }
.appt-head { display:flex; align-items:center; justify-content:space-between; gap:10px; }
.appt-sp { font-size:18px; font-weight:700; color:var(--teal-d); }
.subtabs { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-bottom:12px; }
.subtab { border:1px solid var(--line); background:#fff; color:var(--muted); border-radius:10px; padding:9px; font-weight:600; cursor:pointer; }
.subtab.is-active { background:var(--teal); color:#fff; border-color:transparent; }
.bp-row { display:flex; align-items:flex-start; justify-content:space-between; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); }
.bp-row:last-child { border-bottom:0; }
.bp-name { font-weight:600; }
.q-row { display:flex; align-items:flex-start; justify-content:space-between; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); }
.q-row:last-child { border-bottom:0; }
.q-text { flex:1; }
ul.tight { margin: 4px 0 0; padding-left: 18px; } ul.tight li { padding: 1px 0; }
.lab-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; border: 0; background: transparent; border-bottom: 1px solid var(--line); padding: 10px 0; cursor: pointer; text-align: left; font: inherit; }
.lab-row:last-child { border-bottom: 0; }
.lab-val { color: var(--teal-d); font-weight: 600; white-space: nowrap; }
.chart { width: 100%; height: auto; margin-top: 8px; background: #fbfdfd; border: 1px solid var(--line); border-radius: 10px; }
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 50; }
.modal { background: #fff; border-radius: 16px; padding: 18px; max-width: 420px; width: 100%; }
.modal h2 { margin: 4px 0 8px; } .modal p { margin: 0 0 14px; }
.ed-btn { border:1px solid var(--line); background:#fff; border-radius:8px; padding:8px 10px; font-size:14px; cursor:pointer; color:var(--muted); touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
.addbtn { width:100%; margin-bottom:12px; }
.linkbtn { background:none; border:0; color:var(--muted); text-decoration:underline; font-size:13px; cursor:pointer; padding:6px; }
.linkbtn.danger { color:var(--err); font-weight:600; }
.clearday-row { text-align:center; }
.modal-form { max-width:520px; max-height:88vh; display:flex; flex-direction:column; }
.form-body { overflow:auto; }
.f { margin-bottom:10px; } .f-label { font-size:12px; font-weight:600; color:var(--muted); margin-bottom:3px; }
.f input[type=text], .f input[type=number], .f input[type=date], .f select, .f textarea { width:100%; border:1px solid var(--line); border-radius:8px; padding:8px; font:inherit; }
.f-i18n { display:grid; grid-template-columns:auto 1fr; gap:4px 8px; align-items:center; } .f-i18n span { font-size:11px; color:var(--muted); }
.f-row label { display:flex; align-items:center; gap:8px; }
.f-chks { display:flex; flex-wrap:wrap; gap:6px 12px; } .f-chk { display:inline-flex; align-items:center; gap:4px; font-size:13px; }
.f-rowitem { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-bottom:6px; background:var(--chip); padding:6px; border-radius:8px; }
.f-rowitem input { flex:1 1 80px; border:1px solid var(--line); border-radius:6px; padding:6px; font:inherit; }
.form-actions { display:flex; align-items:center; gap:8px; margin-top:12px; padding-top:10px; border-top:1px solid var(--line); } .form-actions .spacer { flex:1; }
.medseg { display:inline-flex; flex-wrap:wrap; border:1px solid var(--line); border-radius:999px; padding:2px; margin:0 0 6px; }
.medseg button { border:0; background:none; font:inherit; font-size:13px; color:var(--muted); padding:6px 16px; border-radius:999px; cursor:pointer; -webkit-tap-highlight-color:transparent; touch-action:manipulation; }
.medseg button.on { background:var(--teal-d); color:#fff; font-weight:600; }

/* ---- feedback round 1 additions ---- */
.badge.warn { background:#fef3c7; color:var(--warn); }
.badge.prov { background:#e0e7ff; color:#3730a3; }
.badge.cond-tag { background:var(--chip); color:var(--muted); font-weight:600; }
.lab-dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:7px; vertical-align:middle; }
.lab-dot.lab-ok { background:var(--ok); } .lab-dot.lab-warn { background:var(--warn); } .lab-dot.lab-err { background:var(--err); }
.lab-trend { color:var(--muted); font-weight:700; }
.posneg { font-size:12px; font-weight:700; } .posneg-positive { color:var(--err); } .posneg-negative { color:var(--ok); }
.med .subhead, .card > .subhead:first-child { margin-top:0; }
.ep-ongoing-block { padding:6px 0; border-bottom:1px solid var(--line); } .ep-ongoing-block:last-child { border-bottom:0; }
.epnote { width:100%; margin-top:6px; border:1px solid var(--line); border-radius:8px; padding:7px; font:inherit; font-size:14px; resize:vertical; }
.tl-chev { margin-left:auto; color:var(--muted); font-size:18px; align-self:center; }
.sheet-bg { position:fixed; inset:0; background:rgba(0,0,0,.4); display:flex; align-items:flex-end; justify-content:center; z-index:50; }
.sheet { background:#fff; border-radius:18px 18px 0 0; padding:16px 18px calc(20px + env(safe-area-inset-bottom)); width:100%; max-width:720px; box-shadow:0 -4px 24px rgba(0,0,0,.18); animation:sheetUp .18s ease-out; }
.sheet h2 { margin:6px 0 8px; } .sheet p { margin:0 0 14px; }
.sheet-handle { width:40px; height:4px; border-radius:999px; background:var(--line); margin:0 auto 12px; }
@keyframes sheetUp { from { transform:translateY(100%); } to { transform:translateY(0); } }

.daynav.past { background:#fff8e1; border-color:#f3e2b3; }
.daynav.past .dayname input[type="date"], .daynav.past .daysub { color:#92400e; }
.daynav.past .navbtn { background:#fff; border:1px solid #f3e2b3; color:#b45309; }
.sec-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
.sec-head h2 { margin:0; }
.prog-chip { font-size:12px; color:var(--teal-d); background:#e1f5ee; border-radius:999px; padding:2px 9px; font-weight:600; }
.symrow { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:7px 0; border-top:1px solid #eef1f3; }
.symrow.loc { padding:5px 0; }
.symrow-name { background:none; border:0; padding:0; font:inherit; font-weight:600; font-size:14px; color:var(--ink); text-align:left; cursor:pointer; flex:1; min-width:0; display:flex; align-items:center; gap:6px; }
.symrow .sev-row { flex:none; width:auto; display:flex; gap:4px; }
.symrow .sev { width:38px; padding:11px 0; font-size:14px; border-radius:8px; }
.symrow.loc .sev { width:34px; padding:10px 0; font-size:13px; }
.notedot { width:6px; height:6px; border-radius:50%; background:var(--teal); display:inline-block; }
.loc-list { border-left:2px solid var(--chip); padding-left:10px; margin:2px 0 2px 4px; }
.scale-foot { text-align:center; border-top:1px solid var(--line); padding-top:8px; margin-top:6px; font-size:11px; }
.scale-head { border-bottom:1px solid var(--line); padding-bottom:8px; margin-bottom:4px; font-size:11px; line-height:1.5; }
.med { padding:10px 0; }
.linkbtn { background:none; border:0; color:var(--teal); font:inherit; font-size:13px; cursor:pointer; text-decoration:underline; }
.linkbtn.danger { color:var(--err); }
.med-group-label { font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--teal-d); font-weight:600; margin:9px 0 1px; }
.bp-med { display:flex; align-items:baseline; justify-content:space-between; gap:10px; padding:4px 0; border-top:1px solid #f4f6f7; }
.bp-med:first-of-type { border-top:0; }
.bp-med-name { font-weight:600; font-size:14px; }
.bp-med-dose { font-size:13.5px; color:var(--ink); text-align:right; }
.med-status { font-size:11px; background:#fef3c7; color:var(--warn); border-radius:999px; padding:1px 8px; margin-left:7px; font-weight:600; }
.med-l { min-width:0; }
.med-sub { font-size:12.5px; color:var(--muted); margin-top:1px; }
.med-sub .med-dose { color:var(--ink); font-weight:600; }
.med-sched { white-space:nowrap; text-align:right; color:var(--ink); flex-shrink:0; }
.med-sched .sched-x { font-size:14px; font-weight:600; font-variant-numeric:tabular-nums; }
.med-sched .freq { display:block; font-weight:400; color:var(--muted); font-size:12px; margin-top:1px; }
.tick-btn { width:40px; height:40px; border-radius:50%; border:1px solid #bbf7d0; background:#f0fdf4; color:#15803d; font-size:17px; font-weight:700; cursor:pointer; touch-action:manipulation; -webkit-tap-highlight-color:transparent; user-select:none; }
.tick-btn:hover { background:#dcfce7; }
.q-row.answering { flex-direction:column; align-items:stretch; gap:8px; }
.q-note { width:100%; border:1px solid var(--line); border-radius:9px; padding:9px; font:inherit; font-size:14px; resize:vertical; }
.q-actions { display:flex; justify-content:flex-end; }
.q-continue { background:var(--ok); }

/* ===== redesign design-system (scoped to .ds during incremental rollout) ===== */
.ds .card{box-shadow:0 1px 2px rgba(30,40,50,.04),0 2px 8px rgba(30,40,50,.05);border-radius:16px;border:1px solid var(--line);}
.ds .card-h{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px;}
.ds .card-h h2{font-size:15px;font-weight:700;margin:0;}
.ds .hgrp{display:flex;align-items:center;gap:8px;}
.ds .count{font-size:11px;font-weight:700;color:var(--teal-d);background:#e1f5ee;border-radius:999px;padding:2px 9px;}
.ds .drow{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);}
.ds .drow:first-of-type{border-top:0;}
.ds .dname{font-weight:600;}
.ds .dmeta{font-size:13px;color:var(--muted);margin-top:1px;}
.ds .ct-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px;margin-top:8px;}
.ds .ct-grid .dmeta{line-height:1.35;}
.ds .appt-seg, .ds .seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;margin:0 0 12px;}
.ds .appt-seg button, .ds .seg button{border:0;background:none;font:inherit;font-size:12.5px;color:var(--muted);padding:5px 14px;border-radius:999px;cursor:pointer;}
.ds .appt-seg button.on, .ds .seg button.on{background:var(--teal-d);color:#fff;font-weight:600;}
.ds .appt-cols{column-count:2;column-gap:16px;}
.ds .appt-cell{break-inside:avoid;margin-bottom:14px;}
.ds .appt-tap{display:block;width:100%;text-align:left;background:none;border:0;padding:0;font:inherit;cursor:pointer;}

// ---- Shared doctor-readable medication schedule (used by Prep + Records) ----
// Returns { xxx, freq }: an X-X-X dosing string (morning-midday-evening) plus a
// frequency label for anything that isn't a plain daily pattern.
const MED_FREQ_STR = {
  en: { prnLabel: 'PRN', everyOther: 'every other day', everyN: 'every {n} days',
        wd: { mon: 'Mon', tue: 'Tue', wed: 'Wed', thu: 'Thu', fri: 'Fri', sat: 'Sat', sun: 'Sun' } },
  es: { prnLabel: 'PRN', everyOther: 'días alternos', everyN: 'cada {n} días',
        wd: { mon: 'Lun', tue: 'Mar', wed: 'Mié', thu: 'Jue', fri: 'Vie', sat: 'Sáb', sun: 'Dom' } },
};
const MED_SLOT_BY_TIME = { morning: 0, midday: 1, evening: 2, bedtime: 2, prn: null };
function medUnitCount(dose) {
  // Use the leading number only when it's a tablet/capsule count, not a strength (mg/mcg).
  const mt = String(dose || '').match(/^(\d+(?:[.,]\d+)?)\s*(tabs?|tablets?|caps?|capsules?|pills?|puffs?|comp)\b/i);
  return mt ? parseFloat(mt[1].replace(',', '.')) : null;
}
function medNonTablet(m) { return /drop|spray|colirio|\bml\b/i.test(String(m.dose || '') + ' ' + (DL.tx(m.name, 'en') || '')); }
function medSchedule(m, lang) {
  const T = MED_FREQ_STR[lang] || MED_FREQ_STR.en;
  // Explicit override for patterns the structured model can't express.
  if (m.freqLabel && (m.freqLabel[lang] || m.freqLabel.en)) return { xxx: '', freq: m.freqLabel[lang] || m.freqLabel.en };
  const isPrn = m.scheduledDays === 'prn' || (m.status === 'prn' && m.everyNDays == null);
  if (isPrn) return { xxx: '', freq: T.prnLabel };
  // Stopped meds: no X-X-X. (Tapering meds still get an X-X-X; the "tapering off"
  // note is added by the caller, under the X-X-X.)
  if (m.status === 'stopped') return { xxx: '', freq: '' };
  // Eye drops / sprays don't map onto an X-X-X tablet grid.
  if (medNonTablet(m)) return { xxx: '', freq: '' };
  const slot = MED_SLOT_BY_TIME[m.timeOfDay || 'morning'];
  const n = medUnitCount(m.dose) || 1;
  const cells = [0, 0, 0]; if (slot != null) cells[slot] = n;
  const fmtN = (x) => Number.isInteger(x) ? String(x) : String(x).replace('.', lang === 'es' ? ',' : '.');
  const xxx = cells.map(fmtN).join('-');
  let freq = '';
  if (m.everyNDays != null) { freq = m.everyNDays === 2 ? T.everyOther : T.everyN.replace('{n}', m.everyNDays); }
  else if (Array.isArray(m.scheduledDays) && m.scheduledDays.length && m.scheduledDays.length < 7) { freq = m.scheduledDays.map((d) => (T.wd[d] || d)).join('/'); }
  return { xxx, freq };
}
function medScheduleStr(m, lang) { const s = medSchedule(m, lang); return [s.xxx, s.freq].filter(Boolean).join(' · '); }

// Doctor-facing print sheet — a clean one-pager (conditions + medications) built
// from current data, in the current language. Rendered into #printSheet, then
// window.print() (native "Save as PDF"/print). Mirrors the Summary tab's own
// condition labels + med grouping so it never drifts from what the app shows.
function buildDoctorSheet(lang) {
  const data = DL.getData(); if (!data) return '';
  const T = STR[lang]; const bp = DL.bigPicture(data, lang);
  const L = (en, es) => lang === 'es' ? es : en;
  const name = (data.meta && data.meta.patient && data.meta.patient.name) || '';
  const title = (name ? esc(name) + ' — ' : '') + L('health summary', 'resumen de salud');
  const prepared = L('Prepared', 'Preparado') + ' ' + fmtDate(Today.todayISO(), lang);
  // --- Active conditions (same status text the Summary chips use) ---
  const byDateDesc = (a, b) => { const da = a.statusDate || '', db = b.statusDate || ''; if (da === db) return 0; if (!da) return 1; if (!db) return -1; return da < db ? 1 : -1; };
  const condStatus = (c) => c.status === 'investigating'
    ? STATUS[lang].investigating
    : (c.control && c.control !== 'no_treatment' && T.control && T.control[c.control] ? T.control[c.control] : '');
  const condRows = bp.conditions.slice().sort(byDateDesc).map((c) => {
    const meta = [c.statusDate ? `${T.since} ${c.statusDate.slice(0, 4)}` : '', condStatus(c)].filter(Boolean).join(' · ');
    return `<tr><td>${esc(tx(c.name, lang))}</td><td class="ps-right">${esc(meta)}</td></tr>`;
  }).join('') || `<tr><td colspan="2">${T.none}</td></tr>`;
  // --- Medications, grouped like the Summary tab (Regular / Supplements / Therapies / PRN) ---
  const isPrnMed = (m) => m.scheduledDays === 'prn' || (m.status === 'prn' && m.everyNDays == null);
  const TOD_ORDER = { morning: 0, midday: 1, evening: 2, bedtime: 2, prn: 3 };
  const byTimeOfDay = (a, b) => ((TOD_ORDER[a.timeOfDay] != null ? TOD_ORDER[a.timeOfDay] : 1) - (TOD_ORDER[b.timeOfDay] != null ? TOD_ORDER[b.timeOfDay] : 1));
  const all = bp.medications;
  const prn = all.filter(isPrnMed);
  const supp = all.filter((m) => !isPrnMed(m) && m.category === 'supplement').sort(byTimeOfDay);
  const reg = all.filter((m) => !isPrnMed(m) && m.category !== 'supplement' && m.category !== 'therapy').sort(byTimeOfDay);
  const ther = all.filter((m) => !isPrnMed(m) && m.category === 'therapy').sort(byTimeOfDay);
  const medRow = (m) => {
    const s = medSchedule(m, lang); const sched = [s.xxx, s.freq].filter(Boolean).join(' · ');
    return `<tr><td>${esc(tx(m.name, lang))}</td><td>${m.dose ? esc(m.dose) : '—'}</td><td>${esc(sched || '—')}</td></tr>`;
  };
  const medGroup = (label, list) => list.length ? `<tr class="ps-sub"><td colspan="3">${esc(label)}</td></tr>${list.map(medRow).join('')}` : '';
  const medBody = (medGroup(T.secRegular, reg) + medGroup(T.secSupplements, supp) + medGroup(T.secTherapies, ther) + medGroup(T.secPrn, prn)) || `<tr><td colspan="3">${T.none}</td></tr>`;
  return `<div class="ps-head"><div class="ps-title">${title}</div><div class="ps-date">${esc(prepared)}</div></div>
    <div class="ps-h">${L('Active conditions', 'Condiciones activas')}</div>
    <table class="ps-tbl">${condRows}</table>
    <div class="ps-h">${T.currentMeds}</div>
    <div class="ps-legend">${L('Schedule X-X-X = morning · midday · evening', 'Pauta X-X-X = mañana · mediodía · noche')}</div>
    <table class="ps-tbl ps-meds"><thead><tr><th>${L('Medication', 'Medicamento')}</th><th>${L('Dose', 'Dosis')}</th><th>${L('Schedule', 'Pauta')}</th></tr></thead><tbody>${medBody}</tbody></table>`;
}

// Open the doctor one-pager. Primary path: a real browser window with its own
// Print button — works on desktop AND when Atlast runs as an installed PWA
// (where window.print() on the app document silently no-ops). Fallback: the
// hidden in-app #printSheet + window.print() if the pop-out is blocked.
function printDoctorSheet(lang) {
  let body = '';
  try { body = buildDoctorSheet(lang); } catch (err) { setStatus('Could not build the summary: ' + err.message, 'err'); return; }
  if (!body) { setStatus('No data to print yet.', 'err'); return; }
  const title = lang === 'es' ? 'Resumen de salud' : 'Health summary';
  const btn = lang === 'es' ? 'Imprimir / Guardar PDF' : 'Print / Save PDF';
  const doc = `<!doctype html><html lang="${lang}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(title)}</title><style>${PRINT_SHEET_CSS}</style></head><body>${body}<button class="ps-print-btn" onclick="window.print()">${esc(btn)}</button><script>window.addEventListener('load',function(){setTimeout(function(){try{window.print();}catch(e){}},350);});<\/script></body></html>`;
  let w = null;
  try { w = window.open('', '_blank'); } catch (e) { w = null; }
  if (w && w.document) { w.document.open(); w.document.write(doc); w.document.close(); w.focus(); return; }
  // Fallback — pop-out blocked (some installed PWAs): print via the hidden sheet.
  const el = document.getElementById('printSheet');
  if (el) { el.innerHTML = body; try { window.print(); } catch (e) {} }
  else { setStatus('Please allow pop-ups to print.', 'err'); }
}

    const sch = medSchedule(m, lang);

      statusLbl = (T.medStatus && T.medStatus[m.status]) || m.status;
    }
    let right;
    if (sch.xxx) { const sub = [sch.freq, statusLbl].filter(Boolean).join(' · '); right = `${esc(sch.xxx)}${sub ? `<span class="f">${esc(sub)}</span>` : ''}`; }
    else { right = `<span class="f">${esc(sch.freq || statusLbl)}</span>`; }
    const tag = tx(m.purpose, lang) || '';
    const sub = (tag ? esc(tag) : '') + (tag && m.dose ? ' · ' : '') + (m.dose ? `<b>${esc(m.dose)}</b>` : '');
    return `<div class="drow"><div><div class="dname">${esc(tx(m.name, lang))}</div>${sub ? `<div class="dmeta">${sub}</div>` : ''}</div><div class="dright"><div class="sched">${right}</div></div></div>`;
  };
  const TOD_ORDER = { morning: 0, midday: 1, evening: 2, bedtime: 2, prn: 3 };
  const byTimeOfDay = (a, b) => ((TOD_ORDER[a.timeOfDay] != null ? TOD_ORDER[a.timeOfDay] : 1) - (TOD_ORDER[b.timeOfDay] != null ? TOD_ORDER[b.timeOfDay] : 1));
  const allMeds = bp.medications;
  const prnMeds = allMeds.filter(isPrnMed);
  const suppMeds = allMeds.filter((m) => !isPrnMed(m) && m.category === 'supplement').sort(byTimeOfDay);
  const regMeds = allMeds.filter((m) => !isPrnMed(m) && m.category !== 'supplement' && m.category !== 'therapy').sort(byTimeOfDay);
  const therMeds = allMeds.filter((m) => !isPrnMed(m) && m.category === 'therapy').sort(byTimeOfDay);

  const meds = (medSection(T.secRegular, regMeds) + medSection(T.secSupplements, suppMeds) + medSection(T.secTherapies, therMeds) + medSection(T.secPrn, prnMeds)) || `<p class="muted small">${T.none}</p>`;
  // Ruled out — one collapsed line; each item taps for why/when.
  const roItem = (r) => {
    const prov = r.status === 'provisionally_excluded';
    const reason = tx(r.reason, lang);

    return `<details class="ro"><summary><span class="chip ${prov ? 'info' : 'neutral'}">${esc(tx(r.name, lang))}${prov ? ' ↺' : ''}</span><span class="muted small">${r.date ? fmtDate(r.date, lang) : ''} ›</span></summary><div class="ro-why">${esc(why || '—')}</div></details>`;
  };
  const ro = bp.excluded.map(roItem).join('') || `<p class="muted small">${T.none}</p>`;
  // One ✎ per card opens a list to pick which item to edit (instead of a pencil on every row).

  const editBtn = (coll) => `<button class="addmini" data-editpick="${coll}" aria-label="${lang === 'es' ? 'Editar' : 'Edit'}">${ui.editPick === coll ? '✕' : '✎'}</button>`;
  // Conditions + Ruled out share one card with a toggle (single column). Row contents/tags are unchanged.
  const condView = ui.condView || 'active';
  const condSeg = `<div class="seg"><button class="${condView === 'active' ? 'on' : ''}" data-condview="active">${lang === 'es' ? 'Activas' : 'Active'} · ${allConds.length}</button><button class="${condView === 'ruled' ? 'on' : ''}" data-condview="ruled">${T.ruledOut} · ${bp.excluded.length}</button></div>`;

    ? `${editBtn('conditions')}<button class="addmini" data-add="conditions" aria-label="Add condition">＋</button>`
    : `${editBtn('excluded')}<button class="addmini" data-add="conditions" data-prefill='{"status":"excluded"}' aria-label="${lang === 'es' ? 'Añadir descartado' : 'Add ruled-out'}">＋</button>`;
  const condBody = condView === 'active'

  return `<div class="ds">
    <div class="card"><div class="card-h"><h2>${T.activeManaged}</h2><span class="hgrp">${condHdr}</span></div>${condSeg}${condBody}</div>
    <div class="card" id="medsTable"><div class="card-h"><h2>${T.currentMeds}</h2><span class="hgrp">${editBtn('medications')}<button class="addmini" data-add="medications" aria-label="Add medication">＋</button></span></div>${ui.editPick === 'medications' ? pickList(allMeds, 'medications', (m) => tx(m.name, lang)) : meds}${pastSection}</div>

  </div>`;
}

function renderQuestions(state) {
  const lang = state.lang; const T = STR[lang]; const data = DL.getData();
  const todayStr = new Date().toLocaleDateString('en-CA');

  const appts = (data.appointments || []);
  const upcoming = appts.filter((a) => a.date >= todayStr && !a.attended).sort((a, b) => (a.date < b.date ? -1 : 1));
  const past = appts.filter((a) => a.date < todayStr || a.attended).sort((a, b) => (a.date < b.date ? 1 : -1));
  const next = upcoming[0] || null;
  const L = (en, es) => lang === 'en' ? en : es;
  // --- Next-appointment hero ---
  let hero = '';
  if (next) {
    const days = Math.round((new Date(next.date + 'T00:00:00') - new Date(todayStr + 'T00:00:00')) / 86400000);
    const cd = days <= 0 ? L('today', 'hoy') : days === 1 ? L('tomorrow', 'mañana') : L(`in ${days} days`, `en ${days} días`);
    hero = `<div class="vhero"><div class="vlbl">${L('Next appointment', 'Próxima cita')}</div><div class="vwhen">${fmtDate(next.date, lang)}${next.time ? ` · ${esc(next.time)}` : ''}</div><div class="vwho">${esc(spName(next.specialismId))}${spDr(next.specialismId) ? ` · ${esc(spDr(next.specialismId))}` : ''}</div><div class="vhero-foot"><span class="vcd">${cd}</span><button class="vdone" data-pvopen="${next.id}">✓ ${L('Mark done', 'Marcar hecha')}</button></div></div>`;
  }
  // --- Upcoming (rest after next) ---
  const editHint = lang === 'es' ? 'Elige cuál editar:' : 'Choose which to edit:';
  const pickList = (items, coll, nameFn) => `<div class="muted small" style="margin:2px 0 6px">${editHint}</div>` + (items.length ? items.map((it) => `<button class="pickrow" data-edit="${coll}:${it.id}">${esc(nameFn(it))}</button>`).join('') : `<p class="muted small">${T.none}</p>`);
  const editBtn = (coll) => `<button class="addmini" data-editpick="${coll}" aria-label="${lang === 'es' ? 'Editar' : 'Edit'}">${ui.editPick === coll ? '✕' : '✎'}</button>`;
  const apptName = (a) => `${fmtDate(a.date, lang)}${a.time ? ' · ' + a.time : ''} — ${spName(a.specialismId)}`;
  const restUp = upcoming.slice(1);
  // Appointment cell: date · time + specialist. Past cells with a note are tappable to reveal it inline.
  const apptCell = (a, isPast) => {
    const when = `${fmtDate(a.date, lang)}${a.time ? ` · ${esc(a.time)}` : ''}`;
    const who = esc(spName(a.specialismId)); const note = tx(a.note, lang);
    if (isPast && note) {
      const open = ui.apptNotesOpen.has(a.id);
      return `<div class="appt-cell"><button class="appt-tap" data-apptnote="${a.id}"><div class="dname">${when}</div><div class="dmeta">${who} <span class="appt-notechev">${open ? '▾' : '▸'}</span></div></button>${open ? `<div class="appt-note muted small">${esc(note)}</div>` : ''}</div>`;
    }
    return `<div class="appt-cell"><div class="dname">${when}</div><div class="dmeta">${who}</div></div>`;
  };
  const apptList = (items, isPast) => items.length ? `<div class="appt-cols">${items.map((a) => apptCell(a, isPast)).join('')}</div>` : `<p class="muted small">${isPast ? L('No past appointments', 'Sin citas pasadas') : L('Nothing else scheduled', 'Nada más programado')}</p>`;
  const apptView = past.length ? (ui.apptView || 'upcoming') : 'upcoming';
  const apptSeg = past.length ? `<div class="appt-seg"><button class="${apptView === 'upcoming' ? 'on' : ''}" data-apptview="upcoming">${L('Upcoming', 'Próximas')} · ${restUp.length}</button><button class="${apptView === 'past' ? 'on' : ''}" data-apptview="past">${L('Past', 'Pasadas')} · ${past.length}</button></div>` : '';
  const apptBody = apptView === 'past' ? apptList(past, true) : apptList(restUp, false);
  const apptCard = `<div class="card"><div class="card-h"><h2>${L('Appointments', 'Citas')}</h2><span class="hgrp">${editBtn('appointments')}<button class="addmini" data-add="appointments" aria-label="Add appointment">＋</button></span></div>${ui.editPick === 'appointments' ? pickList(upcoming.concat(past), 'appointments', apptName) : `${apptSeg}${apptBody}`}</div>`;
  // --- Questions: grouped by specialist, next-visit specialist first ---
  const openAll = (data.questions || []).filter((q) => q.status === 'open');
  const answeredAll = (data.questions || []).filter((q) => q.status === 'answered');
  const qName = (q) => esc(tx(q.text, lang));
  const aNote = (q) => (q.answerNote && (q.answerNote[lang] || q.answerNote.en)) || '';
  const qRow = (q) => {
    if (ui.answering === q.id) {
      const note = (q.answerNote && q.answerNote[lang]) || '';
      return `<div class="qrow answering"><div class="qtext">${qName(q)}</div><textarea class="q-note" data-qnote="${q.id}" rows="2" placeholder="${T.answerNotePh}">${esc(note)}</textarea><button class="btn q-continue" data-continue="${q.id}">${T.cont}</button></div>`;
    }
    return `<div class="qrow"><button class="qtick" data-answer="${q.id}" aria-label="${T.markAnswered}"></button><div class="qtext">${qName(q)}</div><button class="ed-btn2" data-edit="questions:${q.id}" aria-label="Edit">✎</button></div>`;
  };
  const answeredFold = (ans) => `<details class="q-answered"><summary><span class="ro-caret">▶</span> ${L('Answered', 'Respondidas')} (${ans.length})</summary><div class="q-answered-body">${ans.map((q) => `<div class="qrow answered"><div class="qtext">${qName(q)}${aNote(q) ? `<div class="qanote muted small">${esc(aNote(q))}</div>` : ''}</div><button class="ed-btn2" data-edit="questions:${q.id}" aria-label="Edit">✎</button></div>`).join('')}</div></details>`;
  // Questions are collapsed per specialist (tap the name to expand). Open state lives in ui.qExpanded so it survives re-renders; next-visit specialist starts open.
  if (ui.qExpanded === null) ui.qExpanded = new Set(next ? [next.specialismId] : []);
  const addQBtn = (id) => `<button class="linkbtn" data-add="questions" data-prefill='${esc(JSON.stringify({ specialismId: id }))}' style="margin:6px 0 2px 4px">+ ${L('Add question', 'Añadir pregunta')}</button>`;
  const qGroup = (id, title, qs, ans) => {
    const open = ui.qExpanded.has(id);
    const body = open ? `<div class="qg-body">${qs.map(qRow).join('')}${ans && ans.length ? answeredFold(ans) : ''}${id === '__orphans' ? '' : addQBtn(id)}</div>` : '';
    return `<div class="qg"><button class="qg-sum" data-qexpand="${id}"><span class="qgroup-t">${title}</span><span class="qg-count">${qs.length}</span><span class="qg-caret">${open ? '▾' : '▶'}</span></button>${body}</div>`;
  };
  const order = next ? [next.specialismId, ...specs.map((s) => s.id).filter((id) => id !== next.specialismId)] : specs.map((s) => s.id);
  let groups = '';
  order.forEach((id) => {
    const qs = openAll.filter((q) => q.specialismId === id);
    const ans = answeredAll.filter((q) => q.specialismId === id);
    if (!qs.length && !ans.length) return;
    const isNext = next && id === next.specialismId;
    groups += qGroup(id, `${esc(spName(id))}${isNext ? ` · ${L('next visit', 'próxima visita')}` : ''}`, qs, ans);
  });
  const orphans = openAll.filter((q) => !specs.some((s) => s.id === q.specialismId));
  if (orphans.length) groups += qGroup('__orphans', T.other, orphans, []);
  const qCard = `<div class="card"><div class="card-h"><h2>${L('Questions to ask', 'Preguntas para preguntar')}</h2><button class="addmini" data-add="questions" aria-label="Add question">＋</button></div>${groups || `<p class="muted small">${T.noQuestionsAll}</p>`}</div>`;
  // --- Care team (always exposed; editing folded in here) ---
  const ctSpecs = specs.slice().sort((a, b) => specialistLabel(a, lang).localeCompare(specialistLabel(b, lang), lang === 'es' ? 'es' : 'en'));
  const ct = `<div class="ct-grid">${ctSpecs.map((s) => `<div class="ct-cell"><div class="dname">${esc(specialistLabel(s, lang))}</div>${s.doctor ? `<div class="dmeta">${esc(s.doctor)}</div>` : ''}</div>`).join('')}</div>`;
  const careCard = `<div class="card"><div class="card-h"><h2>${L('Care team', 'Equipo médico')}</h2><span class="hgrp">${editBtn('specialisms')}<button class="addmini" data-add="specialisms" aria-label="Add specialist">＋</button></span></div>${ui.editPick === 'specialisms' ? pickList(ctSpecs, 'specialisms', (s) => specialistLabel(s, lang)) : ct}</div>`;
  // --- Post-visit sheet (Mark done flow) ---
  let pvModal = '';
  if (ui.postVisit) {
    const a = appts.find((x) => x.id === ui.postVisit);
    if (a) {
      const sp = a.specialismId;
      const noteEn = (a.note && a.note.en) || '';
      const openQs = (data.questions || []).filter((q) => q.status === 'open' && q.specialismId === sp);
      const qChecks = openQs.length ? openQs.map((q) => `<label class="pv-check"><input type="checkbox" data-pvq="${q.id}"><span>${qName(q)}</span></label>`).join('') : `<p class="muted small">${L('No open questions for this specialist.', 'Sin preguntas abiertas para este especialista.')}</p>`;
      pvModal = `<div class="modal-bg" data-pvcancelbg><div class="modal" role="dialog">
        <h2 style="margin:0 0 2px">${esc(spName(sp))} — ${fmtDate(a.date, lang)}</h2>
        ${spDr(sp) ? `<div class="muted small" style="margin-bottom:12px">${esc(spDr(sp))}</div>` : '<div style="height:8px"></div>'}
        <div class="f-label">${L('What came out of it?', '¿Qué resultó de la cita?')}</div>
        <textarea id="pvNote" class="q-note" rows="3" placeholder="${L('Decisions, results, next steps…', 'Decisiones, resultados, próximos pasos…')}">${esc(noteEn)}</textarea>
        <div class="f-label" style="margin-top:14px">${L('Questions you raised — tick what you covered', 'Preguntas planteadas — marca las que cubriste')}</div>
        <div class="pv-checks">${qChecks}</div>
        <div class="f-label" style="margin-top:14px">${L('New follow-ups (one per line)', 'Nuevos seguimientos (uno por línea)')}</div>
        <textarea id="pvFollow" class="q-note" rows="2" placeholder="${L('e.g. Chase biopsy results if none by 10 Jul', 'p. ej. reclamar biopsia si no llega para 10 jul')}"></textarea>
        <div class="form-actions" style="margin-top:16px"><span class="spacer"></span><button class="btn ghost" data-pvcancel>${L('Cancel', 'Cancelar')}</button><button class="btn" data-pvsave="${a.id}">${L('Save & archive visit', 'Guardar y archivar')}</button></div>
      </div></div>`;
    }
  }
  return `<div class="ds">${hero}${apptCard}${qCard}${careCard}</div>${pvModal}`;
}

async function onClick(e, state, rerender) {
  const bg = e.target.closest('[data-pvcancelbg]');
  if (bg && e.target === bg) { ui.postVisit = null; rerender(); return; }
  const t = e.target.closest('button');
  if (!t) return;
  if (t.dataset.print != null) { printDoctorSheet(state.lang); return; }
  if (t.dataset.pvopen != null) { ui.postVisit = t.dataset.pvopen; rerender(); return; }
  if (t.dataset.pvcancel != null) { ui.postVisit = null; rerender(); return; }
  if (t.dataset.pvsave != null) {
    const a = DL.getRecord('appointments', t.dataset.pvsave);
    if (a) {
      const todayStr = new Date().toLocaleDateString('en-CA');
      const noteEl = document.getElementById('pvNote');
      if (noteEl) { a.note = a.note || { en: '', es: '' }; a.note.en = noteEl.value; }
      document.querySelectorAll('[data-pvq]:checked').forEach((cb) => DL.markQuestionAnswered(cb.dataset.pvq));
      const followEl = document.getElementById('pvFollow');
      if (followEl) followEl.value.split('\n').map((s) => s.trim()).filter(Boolean).forEach((line) => DL.upsert('questions', { text: { en: line, es: '' }, specialismId: a.specialismId, conditionIds: [], status: 'open', createdDate: todayStr, answerNote: { en: '', es: '' } }));
      a.attended = true; a.attendedDate = todayStr;
      await DL.persist();
    }
    ui.postVisit = null; rerender(); return;
  }
  if (t.dataset.apptview != null) { ui.apptView = t.dataset.apptview; rerender(); return; }
  if (t.dataset.condview != null) { ui.condView = t.dataset.condview; rerender(); return; }
  if (t.dataset.apptnote != null) { const id = t.dataset.apptnote; ui.apptNotesOpen = ui.apptNotesOpen || new Set(); ui.apptNotesOpen.has(id) ? ui.apptNotesOpen.delete(id) : ui.apptNotesOpen.add(id); rerender(); return; }
  if (t.dataset.qexpand != null) { const id = t.dataset.qexpand; ui.qExpanded = ui.qExpanded || new Set(); ui.qExpanded.has(id) ? ui.qExpanded.delete(id) : ui.qExpanded.add(id); rerender(); return; }
  if (t.dataset.editpick != null) { ui.editPick = ui.editPick === t.dataset.editpick ? null : t.dataset.editpick; rerender(); return; }
  if (t.dataset.answer) { ui.answering = (ui.answering === t.dataset.answer) ? null : t.dataset.answer; rerender(); return; }
  if (t.dataset.continue) { const qid = t.dataset.continue; const ta = document.querySelector('.q-note[data-qnote="' + qid + '"]'); const rec = DL.getRecord('questions', qid); if (rec && ta) { rec.answerNote = rec.answerNote || { en: '', es: '' }; rec.answerNote[state.lang] = ta.value; } DL.markQuestionAnswered(qid); ui.answering = null; await DL.persist(); rerender(); return; }
}

function onChange(e, state, rerender) {
  const t = e.target;
  if (t && t.dataset && t.dataset.spfilter !== undefined) { ui.specialistId = t.value || null; ui.answering = null; rerender(); return; }
}

return { ui, renderBig, renderQuestions, onClick, onChange };
})();

let fs = null, fcol = null, fmode = null, fconfirm = false, ferr = '';
let fdosePanel = false, fdoseDraft = null;
function isOpen() { return fcol != null; }
function open(collection, id, prefill) {
  fcol = collection; fconfirm = false; ferr = ''; fdosePanel = false; fdoseDraft = null;
  const spec = SPECS[collection];
  fs = id ? JSON.parse(JSON.stringify(DL.getRecord(collection, id) || {})) : JSON.parse(JSON.stringify(spec.defaults || {}));
  fmode = id ? 'edit' : 'add';
  if (!id && prefill) Object.assign(fs, prefill);
  // New symptom: default the start date to today (user can back-date it in the form).

}
function close() { fcol = null; fs = null; fmode = null; fconfirm = false; ferr = ''; fdosePanel = false; fdoseDraft = null; }

function gv(o, k) { return k.split('.').reduce((a, p) => (a == null ? a : a[p]), o); }
function sv(o, k, v) { const ps = k.split('.'); let t = o; for (let i = 0; i < ps.length - 1; i++) { t[ps[i]] = t[ps[i]] || {}; t = t[ps[i]]; } t[ps[ps.length - 1]] = v; }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

function srcOptions(source) {
  const data = DL.getData();
  if (source === 'specialisms') return (data.specialisms || []).map((s) => ({ v: s.id, l: s.specialism }));
  if (source === 'conditions') return (data.conditions || []).map((c) => ({ v: c.id, l: c.name.en }));
  return [];
}

function field(f) {
  if (f.showIf && !f.showIf(fs)) return '';
  const L = `<div class="f-label">${f.label}</div>`;
  if (f.type === 'text' || f.type === 'number') return `<div class="f">${L}<input type="${f.type === 'number' ? 'number' : 'text'}" step="any" data-fkey="${f.key}" value="${esc(gv(fs, f.key) ?? '')}" placeholder="${esc(f.ph || '')}"></div>`;
  if (f.type === 'date') return `<div class="f">${L}<input type="date" data-fkey="${f.key}" value="${esc(gv(fs, f.key) ?? '')}"></div>`;
  if (f.type === 'checkbox') return `<div class="f f-row"><label><input type="checkbox" data-fkey="${f.key}" data-bool ${gv(fs, f.key) ? 'checked' : ''}> ${f.label}</label></div>`;
  if (f.type === 'seg') { const cur = gv(fs, f.key); const btns = (f.options || []).map((o) => { const v = typeof o === 'string' ? o : o.v; const l = typeof o === 'string' ? o : o.l; return `<button type="button" class="${cur === v ? 'on' : ''}" data-formaction="segpick" data-segkey="${f.key}" data-segval="${v}">${esc(l)}</button>`; }).join(''); return `<div class="f">${L}<div class="medseg" style="flex-wrap:wrap">${btns}</div></div>`; }
  if (f.type === 'i18n') { const v = gv(fs, f.key) || { en: '', es: '' }; const mk = (lang) => f.textarea ? `<textarea data-fkey="${f.key}" data-lang="${lang}" rows="2" placeholder="${esc(f.ph || '')}">${esc(v[lang])}</textarea>` : `<input type="text" data-fkey="${f.key}" data-lang="${lang}" value="${esc(v[lang])}" placeholder="${esc(f.ph || '')}">`; return `<div class="f">${L}${mk('en')}</div>`; }
  if (f.type === 'datalist') { const opts = (f.source === 'labGroups' ? DL.labGroups() : []).map((g) => `<option value="${esc(g)}"></option>`).join(''); const id = 'dl_' + f.key.replace(/\./g, '_'); return `<div class="f">${L}<input type="text" list="${id}" data-fkey="${f.key}" value="${esc(gv(fs, f.key) ?? '')}"><datalist id="${id}">${opts}</datalist></div>`; }
  if (f.type === 'select') { const cur = gv(fs, f.key); const blank = (f.required && !cur) ? '<option value="" selected disabled>— Choose —</option>' : (f.optional ? '<option value="">—</option>' : ''); const opts = f.options ? f.options.map((o) => `<option value="${o}" ${cur === o ? 'selected' : ''}>${o}</option>`).join('') : srcOptions(f.source).map((o) => `<option value="${o.v}" ${cur === o.v ? 'selected' : ''}>${esc(o.l)}</option>`).join(''); return `<div class="f">${L}<select data-fkey="${f.key}">${blank}${opts}</select></div>`; }
  if (f.type === 'multiselect') { const cur = gv(fs, f.key) || []; const boxes = srcOptions(f.source).map((o) => `<label class="f-chk"><input type="checkbox" data-fkey="${f.key}" data-msval="${o.v}" ${cur.includes(o.v) ? 'checked' : ''}> ${esc(o.l)}</label>`).join(''); return `<div class="f">${L}<div class="f-chks">${boxes}</div></div>`; }
  if (f.type === 'weekdays') { const cur = Array.isArray(gv(fs, f.key)) ? gv(fs, f.key) : []; const boxes = WD.map((d) => `<label class="f-chk"><input type="checkbox" data-fkey="${f.key}" data-wd="${d}" ${cur.includes(d) ? 'checked' : ''}> ${d}</label>`).join(''); return `<div class="f">${L}<div class="f-chks">${boxes}</div></div>`; }
  if (f.type === 'rows') { const rows = (gv(fs, f.key) || []).map((r, i) => { const subs = f.sub.map((sf) => { if (sf.type === 'i18n') { const v = r[sf.key] || { en: '', es: '' }; return `<input type="text" placeholder="${sf.label}" data-row="${f.key}" data-idx="${i}" data-sub="${sf.key}" data-lang="en" value="${esc(v.en)}">`; } return `<input type="${sf.type === 'number' ? 'number' : (sf.type === 'date' ? 'date' : 'text')}" step="any" placeholder="${sf.label}" data-row="${f.key}" data-idx="${i}" data-sub="${sf.key}" value="${esc(r[sf.key] ?? '')}">`; }).join(''); return `<div class="f-rowitem">${subs}<button class="btn-sm" data-formaction="delrow" data-row="${f.key}" data-idx="${i}">×</button></div>`; }).join(''); return `<div class="f">${L}${rows}<button class="btn ghost" data-formaction="addrow" data-row="${f.key}">+ Add</button></div>`; }
  if (f.type === 'locrows') { const rows = (gv(fs, f.key) || []).map((r, i) => { const v = r.name || { en: '', es: '' }; return `<div class="f-rowitem"><input type="text" placeholder="Location" data-row="${f.key}" data-idx="${i}" data-sub="name" data-lang="en" value="${esc(v.en)}"><label class="f-chk"><input type="checkbox" data-row="${f.key}" data-idx="${i}" data-sub="archived" data-bool ${r.archived ? 'checked' : ''}> arch.</label></div>`; }).join(''); return `<div class="f">${L}${rows}<button class="btn ghost" data-formaction="addrow" data-row="${f.key}">+ Add location</button></div>`; }
  return '';
}

function medToday() { return new Date().toISOString().slice(0, 10); }
function medStatusBadge(st) {
  const map = { active: ['#ecfdf3', 'var(--ok)', 'Currently taking'], stopped: ['var(--chip)', 'var(--muted)', 'Stopped · in past meds'], tapering: ['#fff8e1', 'var(--warn)', 'Tapering off'], prn: ['var(--chip)', 'var(--muted)', 'As needed'] };
  const m = map[st] || map.active;
  return `<div style="display:inline-block;background:${m[0]};color:${m[1]};font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;margin:0 0 12px">${m[2]}</div>`;
}
function medFreqControlHtml(F) {
  const isPrn = fs.scheduledDays === 'prn';
  const isInterval = !isPrn && fs.everyNDays != null;
  const allDays = Array.isArray(fs.scheduledDays) && fs.scheduledDays.length === 7;
  const cur = isPrn ? 'prn' : (isInterval ? 'everyn' : (allDays ? 'daily' : 'weekly'));
  const btn = (v, l) => `<button type="button" class="${cur === v ? 'on' : ''}" data-formaction="medfreq" data-freq="${v}">${l}</button>`;
  const seg = `<div class="medseg">${btn('daily', 'Daily')}${btn('weekly', 'Weekly')}${btn('everyn', 'Every N days')}${btn('prn', 'As needed')}</div>`;
  const days = cur === 'weekly' ? field(F.scheduledDays) : '';
  const everyn = cur === 'everyn' ? field(Object.assign({}, F.everyNDays, { label: 'Every how many days', showIf: null })) : '';
  return `<div class="f"><div class="f-label">How often</div>${seg}${days}${everyn}</div>`;
}
function medFormBody(spec) {
  const F = {}; spec.fields.forEach((f) => { F[f.key] = f; });
  const isAdd = fmode === 'add';
  const st = fs.status || 'active';
  let actions = '';
  if (!isAdd) {
    const doseBtn = `<button class="btn ghost" data-formaction="dosepanel" style="flex:1">Change dose</button>`;
    const stopBtn = st === 'stopped'
      ? `<button class="btn ghost" data-formaction="medresume" style="flex:1">Resume taking</button>`
      : `<button class="btn ghost" data-formaction="medstop" style="flex:1;color:var(--err)">Stop taking</button>`;
    actions = `<div style="display:flex;gap:8px;margin:0 0 14px">${doseBtn}${stopBtn}</div>`;
  }
  let dosePanel = '';
  if (fdosePanel) {
    const d = fdoseDraft || {};
    dosePanel = `<div style="background:#ecfdf3;border:1px solid #b7e4c7;border-radius:10px;padding:12px;margin:0 0 14px">
      <div style="font-weight:600;margin-bottom:8px">Change dose</div>
      <div class="f"><div class="f-label">New dose</div><input type="text" data-dosedraft="dose" value="${esc(d.dose || '')}"></div>
      <div class="f"><div class="f-label">From which date</div><input type="date" data-dosedraft="date" value="${esc(d.date || '')}"></div>
      <div style="display:flex;gap:8px"><button class="btn" data-formaction="dosesave" style="flex:1">Save dose change</button><button class="btn ghost" data-formaction="dosecancel">Cancel</button></div>
      <div class="muted small" style="margin-top:6px">The old dose is kept in the history automatically.</div>
    </div>`;
  }
  const stoppedDate = (!isAdd && st === 'stopped')
    ? field(Object.assign({}, F.stopDate, { label: 'Stopped on' })) + `<div class="muted small" style="margin:-4px 0 10px">Set to today — tap to change it if you stopped on a different day.</div>`
    : '';
  const simple = [
    field(F.name),
    isAdd ? '' : medStatusBadge(st),
    actions,
    dosePanel,
    stoppedDate,
    field(F.dose),
    field(Object.assign({}, F.purpose, { label: "What it's for", ph: 'free text — e.g. NSAID for joint pain' })),
    medFreqControlHtml(F),
    fs.scheduledDays === 'prn' ? '' : field(F.timeOfDay),
    field(F.track),
    field(F.category),
    field(F.startDate),
  ].join('');
  const adv = [
    field(F.freqLabel) + '<div class="muted small" style="margin-top:-4px">overrides the 0-0-1 schedule, e.g. showing "as needed" instead</div>',
    field(F.status),
    field(F.lastDoseChange),
    field(F.doseHistory),
    field(F.notes),
  ].join('');
  return simple + `<details style="margin-top:10px;border-top:1px solid var(--line);padding-top:8px"><summary style="cursor:pointer;color:var(--muted);font-size:14px">Advanced options</summary><div style="margin-top:10px">${adv}</div></details>`;
}

function renderForm() {
  if (!fcol) return '';
  const spec = SPECS[fcol];
  const body = fcol === 'medications' ? medFormBody(spec) : spec.fields.map(field).join('');
  const delLabel = fconfirm ? 'Confirm delete' : (spec.archive ? 'Archive' : 'Delete');
  const delBtn = fmode === 'edit' ? `<button class="btn ${fconfirm ? '' : 'ghost'}" data-formaction="delete" style="${fconfirm ? 'background:var(--err)' : 'color:var(--err)'}">${delLabel}</button>` : '';
  return `<div class="modal-bg" data-formaction="cancelbg"><div class="modal modal-form" role="dialog">
    <h2>${fmode === 'add' ? 'Add' : 'Edit'} ${spec.title}</h2>
    <div class="form-body">${body}</div>
    ${ferr ? `<div class="f-err" style="color:var(--err);font-size:13px;margin:4px 2px 0">${esc(ferr)}</div>` : ''}
    <div class="form-actions">${delBtn}<span class="spacer"></span><button class="btn ghost" data-formaction="cancel">Cancel</button><button class="btn" data-formaction="save">${fcol === 'medications' && fmode === 'add' ? 'Add medication' : 'Save'}</button></div>
  </div></div>`;
}

function onInput(e) {
  if (!fcol) return;
  const el = e.target; const k = el.dataset.fkey; const rowKey = el.dataset.row;
  if (el.dataset.dosedraft !== undefined) { fdoseDraft = fdoseDraft || {}; fdoseDraft[el.dataset.dosedraft] = el.value; return; }
  if (rowKey) {
    const idx = Number(el.dataset.idx); const sub = el.dataset.sub; const lang = el.dataset.lang;
    fs[rowKey] = fs[rowKey] || []; fs[rowKey][idx] = fs[rowKey][idx] || {};
    const row = fs[rowKey][idx];
    if (lang) { row[sub] = row[sub] || { en: '', es: '' }; row[sub][lang] = el.value; }
    else if (el.dataset.bool !== undefined) row[sub] = el.checked;
    else row[sub] = el.value;
    return;
  }
  if (k === undefined) return;
  if (el.dataset.wd) { const arr = Array.isArray(fs[k]) ? fs[k] : []; const d = el.dataset.wd; fs[k] = el.checked ? [...new Set([...arr, d])] : arr.filter((x) => x !== d); return; }
  if (el.dataset.msval) { const arr = Array.isArray(fs[k]) ? fs[k] : []; const v = el.dataset.msval; fs[k] = el.checked ? [...new Set([...arr, v])] : arr.filter((x) => x !== v); return; }
  const lang = el.dataset.lang;
  if (lang) { const cur = gv(fs, k) || { en: '', es: '' }; cur[lang] = el.value; sv(fs, k, cur); return; }
  if (el.dataset.bool !== undefined) { sv(fs, k, el.checked); return; }
  if (el.type === 'number') { sv(fs, k, el.value === '' ? null : Number(el.value)); return; }
  sv(fs, k, el.value === '' ? (el.type === 'date' ? null : el.value) : el.value);
}

function postprocess() {
  if (fcol === 'medications') {
    if (fs.scheduledDays === 'prn') { fs.everyNDays = undefined; fs.anchorDate = undefined; }
    else if (fs.everyNDays != null) { fs.everyNDays = Number(fs.everyNDays); fs.scheduledDays = null; if (!fs.anchorDate) fs.anchorDate = fs.startDate || medToday(); }
    else { fs.everyNDays = undefined; fs.anchorDate = undefined; if (!Array.isArray(fs.scheduledDays)) fs.scheduledDays = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun']; }
    Object.keys(fs).forEach((k) => fs[k] === undefined && delete fs[k]);
    if (!Array.isArray(fs.doseHistory)) fs.doseHistory = [];
    if (fs.lastDoseChange === undefined) fs.lastDoseChange = null;
  }
  if (fcol === 'labs') {
    const rr = fs.referenceRange;
    if (rr && rr.low == null && rr.high == null) fs.referenceRange = null;
    (fs.results || []).forEach((r) => { if (r.value === '' || r.value === undefined) r.value = null; else if (r.value != null) r.value = Number(r.value); if (!r.qualitative) r.qualitative = null; });
  }
  if (fcol === 'symptomTypes') {
    // New symptoms created via this generic editor must carry an addedDate, same as addSymptomType() does.
    // Without it, typesOn()/isComplete() treat the symptom as always-present and retroactively un-complete every past day.
    // Gate on !fs.id (creation only) so intentionally addedDate-less seed symptoms aren't stamped when merely edited.
    if (!fs.id && fs.addedDate === undefined) fs.addedDate = new Date().toISOString().slice(0, 10);
    if (fs.onsetDate === '') fs.onsetDate = null; // empty start-date field → null (schema wants a nullable date)
    (fs.locations || []).forEach((l) => { if (!l.id) l.id = DL.genId('loc'); if (!l.name) l.name = { en: '', es: '' }; if (l.addedDate === undefined) l.addedDate = new Date().toISOString().slice(0, 10); l.archived = !!l.archived; });
    if (fs.trackBy === 'single') fs.locations = fs.locations || [];
  }
}

async function onClick(e, rerender) {
  if (!fcol) return false;
  const t = e.target.closest('[data-formaction]');
  if (!t) return true;
  const a = t.dataset.formaction;
  if (a === 'cancel' || (a === 'cancelbg' && e.target === t)) { close(); rerender(); return true; }
  if (a === 'addrow') { fs[t.dataset.row] = fs[t.dataset.row] || []; fs[t.dataset.row].push({}); rerender(); return true; }
  if (a === 'delrow') { fs[t.dataset.row].splice(Number(t.dataset.idx), 1); rerender(); return true; }
  if (a === 'medstop') { fs.status = 'stopped'; if (!fs.stopDate) fs.stopDate = medToday(); rerender(); return true; }
  if (a === 'medresume') { fs.status = 'active'; fs.stopDate = null; rerender(); return true; }
  if (a === 'segpick') { sv(fs, t.dataset.segkey, t.dataset.segval); rerender(); return true; }
  if (a === 'dosepanel') { fdosePanel = true; fdoseDraft = { dose: fs.dose || '', date: medToday() }; rerender(); return true; }
  if (a === 'dosecancel') { fdosePanel = false; fdoseDraft = null; rerender(); return true; }
  if (a === 'dosesave') { const d = fdoseDraft || {}; const dt = d.date || medToday(); if (!Array.isArray(fs.doseHistory)) fs.doseHistory = []; fs.doseHistory.unshift({ date: dt, dose: d.dose || '', note: '' }); if (d.dose) fs.dose = d.dose; fs.lastDoseChange = dt; fdosePanel = false; fdoseDraft = null; rerender(); return true; }
  if (a === 'medfreq') { const v = t.dataset.freq;
    if (v === 'prn') { fs.scheduledDays = 'prn'; fs.everyNDays = undefined; fs.anchorDate = undefined; fs.timeOfDay = 'prn'; }
    else { if (fs.timeOfDay === 'prn') fs.timeOfDay = 'morning';
      if (v === 'daily') { fs.scheduledDays = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun']; fs.everyNDays = undefined; fs.anchorDate = undefined; }
      else if (v === 'weekly') { if (!Array.isArray(fs.scheduledDays) || fs.scheduledDays.length === 7) fs.scheduledDays = ['mon']; fs.everyNDays = undefined; fs.anchorDate = undefined; }
      else if (v === 'everyn') { fs.scheduledDays = null; if (fs.everyNDays == null) fs.everyNDays = 2; if (!fs.anchorDate) fs.anchorDate = fs.startDate || medToday(); }
    }
    rerender(); return true; }
  if (a === 'delete') {
    if (!fconfirm) { fconfirm = true; rerender(); return true; }
    const spec = SPECS[fcol];
    if (spec.archive) DL.archiveSymptomType(fs.id, true); else DL.remove(fcol, fs.id);
    await DL.persist(); close(); rerender(); return true;
  }

  const errHtml = v.errors.length ? '<details class="msgs" open><summary>' + v.errors.length + ' error(s)</summary><ul class="msglist">' + v.errors.map((e) => '<li>✗ ' + escapeHtml(e) + '</li>').join('') + '</ul></details>' : '';
  const warnHtml = v.warnings.length ? '<details class="msgs"><summary>' + v.warnings.length + ' note(s)</summary><ul class="msglist">' + v.warnings.map((w) => '<li>! ' + escapeHtml(w) + '</li>').join('') + '</ul></details>' : '';
  const curK = (data.meta && data.meta.burdenBands && typeof data.meta.burdenBands.k === 'number') ? data.meta.burdenBands.k : 2;
  const curVH = (data.meta && data.meta.burdenBands && typeof data.meta.burdenBands.vhCount === 'number') ? data.meta.burdenBands.vhCount : 2;
  const curT = (data.meta && data.meta.burdenBands && typeof data.meta.burdenBands.t === 'number') ? data.meta.burdenBands.t : 1;
  const rn = (n) => '<span style="color:#8a97a3;font-size:12px">(' + n + ')</span>';
  const bInput = (id, min, val) => '<input type="number" id="' + id + '" min="' + min + '" step="1" value="' + val + '" style="width:46px;display:inline-block;text-align:center;vertical-align:baseline;margin:0 2px">';
  return odPanel() +
    '<div class="card"><h2>Display options</h2>' +
    '<div class="f f-row"><label><input type="checkbox" id="prefEnglishOnly"' + (getPref('englishOnly') ? ' checked' : '') + '> English only (hide the EN/ES switch)</label></div>' +
    '<div class="f f-row"><label><input type="checkbox" id="prefHideEpisodes"' + (getPref('hideEpisodes') ? ' checked' : '') + '> Hide episode tracking (Log &amp; Trends)</label></div>' +
    '</div>' +
    '<div class="card"><h2>Burden scale</h2>' +
    '<p class="muted small" style="margin:0 0 12px">How each day’s level is set from your symptom ratings. The boxes are yours to adjust.</p>' +
    '<div style="display:flex;flex-direction:column;gap:11px;font-size:15px;line-height:1.6">' +
      '<div style="display:flex;gap:10px"><span style="flex:0 0 12px;height:12px;border-radius:3px;background:#fde047;margin-top:5px"></span>' +
        '<span><b>Light</b> — symptoms only noticeable ' + rn(1) + ', or up to ' + bInput('burdenT', 0, curT) + ' distracting ' + rn(2) + '</span></div>' +
      '<div style="display:flex;gap:10px"><span style="flex:0 0 12px;height:12px;border-radius:3px;background:#f59e0b;margin-top:5px"></span>' +
        '<span><b>Typical</b> — ' + bInput('burdenTt', 1, curT + 1) + ' or more distracting ' + rn(2) + ', or one interfering ' + rn(3) + ' on its own</span></div>' +
      '<div style="display:flex;gap:10px"><span style="flex:0 0 12px;height:12px;border-radius:3px;background:#f97316;margin-top:5px"></span>' +
        '<span><b>Difficult</b> — one interfering ' + rn(3) + ' with ' + bInput('burdenK', 1, curK) + ' others distracting ' + rn(2) + ', two interfering ' + rn(3) + ', or one that prevents activity ' + rn(4) + '</span></div>' +
      '<div style="display:flex;gap:10px"><span style="flex:0 0 12px;height:12px;border-radius:3px;background:#b91c1c;margin-top:5px"></span>' +
        '<span><b>Severe</b> — ' + bInput('burdenVH', 2, curVH) + ' or more interfering ' + rn(3) + ' or worse, at once</span></div>' +
    '</div>' +
    '</div>' +
    '<div class="card"><h2>Parse report ' + verdict + '</h2>' +
    '<div class="kv"><span class="k">Source</span><span class="v">' + escapeHtml(pr.source || '') + '</span></div>' +
    errHtml + warnHtml + '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;"><button id="exportBtn" class="btn">⤓ Export data</button><label class="btn ghost" style="cursor:pointer">⤒ Import data<input id="importFile" type="file" accept=".json,application/json" hidden></label><button id="resetSeedBtn" class="btn ghost">↺ Reset to seed</button></div><p class="muted small" style="margin-top:8px">Export saves everything to a <b>health-data.json</b> file you can keep or send to lock in your work. Import loads one back.</p></div>' +
    '<div class="card"><h2>Records parsed</h2><div class="grid">' + statsHtml + '</div></div>';
}
function odPanel() {
  const configured = OneDrive.isConfigured();
  const signedIn = OneDrive.isSignedIn();
  const status = !configured ? 'Not set up yet — paste your Client ID below, then sign in.'
    : (signedIn ? ('Signed in as ' + escapeHtml(OneDrive.accountName()) + ' · changes sync to OneDrive automatically.')
                : 'Set up. Tap “Sign in with Microsoft” to start syncing.');
  const authBtn = configured ? (signedIn
    ? '<button id="odSignOut" class="btn ghost">Sign out</button><button id="odSync" class="btn">Sync now</button>'
    : '<button id="odSignIn" class="btn">Sign in with Microsoft</button>') : '';
  return '<div class="card"><h2>OneDrive sync</h2>' +
    '<p class="muted small">' + status + '</p>' +
    '<div class="f"><div class="f-label">Microsoft Client ID</div><input id="odClientId" type="text" value="' + escapeHtml(OneDrive.getClientId()) + '" placeholder="paste the Application (client) ID"></div>' +
    '<details class="msgs"><summary>Advanced: file location in OneDrive</summary><div class="f" style="margin-top:8px"><input id="odPath" type="text" value="' + escapeHtml(OneDrive.getFilePath()) + '"></div></details>' +
    '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;"><button id="odSaveCfg" class="btn ghost">Save settings</button>' + authBtn + '</div></div>';
}
function escapeHtml(s) { return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function downloadJSON() { const blob = new Blob([exportJSON()], { type: 'application/json' }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'health-data.json'; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(a.href); }
function registerSW() { if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js').catch((e) => console.warn('SW register failed', e)); } }

})();
</script>
</body>
</html>
