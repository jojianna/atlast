function lineChart(lab, win, lang) {

  const vals = numeric.map((p) => p.value);
  const refHigh = lab.referenceRange && lab.referenceRange.high != null ? lab.referenceRange.high : (lab.displayMode === 'x_uln' ? 1 : null);

  const refLine = refHigh != null ? `<line x1="${padL}" y1="${y(refHigh).toFixed(1)}" x2="${W - padR}" y2="${y(refHigh).toFixed(1)}" stroke="#dc2626" stroke-width="1" stroke-dasharray="4 3"/><text x="${W - padR}" y="${(y(refHigh) - 3).toFixed(1)}" font-size="9" fill="#dc2626" text-anchor="end">${lab.displayMode === 'x_uln' ? T.ulnLine : T.refRange + ' ' + refHigh}</text>` : '';

async function token() {

function pathUrl(path) { return 'https://graph.microsoft.com/v1.0/me/drive/root:/' + path.replace(/^\/+/, '').split('/').map(encodeURIComponent).join('/'); }

async function gfetch(url, opts = {}) {
  const t = await token();
  const headers = Object.assign({}, opts.headers || {}, { Authorization: 'Bearer ' + t });
  return fetch(url, Object.assign({}, opts, { headers }));
}

const oneDriveSource = {
  name: 'OneDrive',
  async read() {
    if (!getClientId()) { return { data: _templateProvider(), etag: null }; }
    const p = await pca();
    if (!_account) { return { data: _templateProvider(), etag: null }; }
    const res = await gfetch(dataUrl() + ':/content');
    if (res.status === 404) { _etag = null; return { data: _templateProvider(), etag: null }; }
    if (!res.ok) throw new Error('OneDrive read failed (HTTP ' + res.status + ')');
    _etag = res.headers.get('etag');
    const data = await res.json();
    return { data, etag: _etag };
  },
  async write(data) {
    if (!_account) throw new Error('Not signed in');
    const body = JSON.stringify(data, null, 2);
    const headers = { 'Content-Type': 'application/json' };
    if (_etag) headers['If-Match'] = _etag;
    let res = await gfetch(dataUrl() + ':/content', { method: 'PUT', headers, body });
    if (res.status === 412) {
      try { const cur = await gfetch(dataUrl() + ':/content'); if (cur.ok) { const txt = await cur.text(); await gfetch(bakUrl() + ':/content', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: txt }); } } catch {}
      res = await gfetch(dataUrl() + ':/content', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body });
    }
    if (!res.ok) throw new Error('OneDrive write failed (HTTP ' + res.status + ')');
    const j = await res.json().catch(() => null);
    _etag = (j && (j.eTag || j.cTag)) || _etag;
    try { await writeSummary(data); } catch (e) { console.warn('summary mirror failed', e); }

  },

function tx(f, lang) { if (f == null) return ''; if (typeof f === 'string') return f; return (f[lang] || f.en || '').trim(); }
function buildSummary(d) {
  const L = 'en'; const lines = [];
  lines.push('# Health summary (auto-generated — read only)'); lines.push('');
  lines.push('_Mirror of health-data.json. Do not edit by hand; edit the app or the JSON._'); lines.push('');
  const active = (d.conditions || []).filter((c) => c.status === 'confirmed' || c.status === 'under_review');
  if (active.length) { lines.push('## Active conditions'); active.forEach((c) => lines.push('- ' + tx(c.name, L) + ' — ' + c.status + (c.diagnosedDate ? ' (dx ' + c.diagnosedDate + ')' : ''))); lines.push(''); }
  const meds = (d.medications || []).filter((m) => m.status !== 'stopped');
  if (meds.length) { lines.push('## Current medications'); meds.forEach((m) => lines.push('- ' + tx(m.name, L) + ' ' + (m.dose || '') + ' — ' + (m.schedule || ''))); lines.push(''); }
  const excl = (d.ruledOut || []);
  if (excl.length) { lines.push('## Ruled out / excluded'); excl.forEach((r) => lines.push('- ' + tx(r.condition, L) + ' — ' + tx(r.how, L) + (r.status === 'provisionally_excluded' ? ' (may re-test)' : ''))); lines.push(''); }
  const ongoing = (d.episodes || []).filter((e) => e.endDate == null);
  if (ongoing.length) { lines.push('## Ongoing episodes'); ongoing.forEach((e) => lines.push('- ' + tx(e.name, L) + ' (since ' + e.startDate + ')')); lines.push(''); }
  if (d.meta && d.meta.updatedAt) lines.push('_Updated ' + d.meta.updatedAt + '_');

}
