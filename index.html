<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#0f766e" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="favicon-32.png" sizes="32x32" />
  <link rel="apple-touch-icon" href="apple-touch-icon-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Atlast" />
  <style>
:root {
  --teal:#0f766e; --teal-d:#0b5e57; --bg:#f6f7f8; --card:#fff; --ink:#16202a; --muted:#5b6b7a; --line:#e3e8ec;
  --ok:#15803d; --warn:#b45309; --err:#b91c1c; --info:#1d4ed8; --chip:#eef2f4; --tabbar-h:60px; --us:#be185d; --us-soft:#e79ab5;
  /* status tints (pale fills that pair with the solid role colors above) */
  --teal-tint:#e1f5ee; --ok-tint:#dcfce7; --warn-tint:#fef3c7; --err-tint:#fee2e2; --info-tint:#dbeafe; --us-tint:#fbe4ee;
  /* Time-together quality ranks: dates (best) → quality → neither (least) */
  --rank1:var(--us); --rank1-bg:var(--us-tint); --rank2:#d4537e; --rank2-bg:#fbeef4; --rank3:#9aa3b2; --rank3-bg:#f4f3f4; --rank3-edge:#d8d2d6;
  /* 5-step symptom severity scale — the single source for .sev-*, .fill*, .calb* and the burden swatches */
  --sev-0:#94a3b8; --sev-1:#fde047; --sev-2:#f59e0b; --sev-3:#f97316; --sev-4:#b91c1c;
  --sev-0-ink:#fff; --sev-1-ink:#422006; --sev-2-ink:#fff; --sev-3-ink:#fff; --sev-4-ink:#fff;
  /* radius scale — sm inputs/small buttons · md buttons · lg cards/sheets · pill chips/toggles */
  --r-sm:8px; --r-md:12px; --r-lg:16px; --r-pill:999px; --radius:var(--r-lg);
}
/* Type scale (px) — stick to these steps; no half-pixels:
   11 micro-labels/eyebrows · 12 captions/meta · 13 secondary · 14 body · 15 card body
   16 base · 17–18 controls · 20/22 stat numbers · 32 hero numbers */
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { margin:0; padding:0; }
body { font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; background:var(--bg); color:var(--ink); padding-bottom:calc(var(--tabbar-h) + env(safe-area-inset-bottom)); }
.topbar { position:sticky; top:0; z-index:10; display:flex; align-items:center; justify-content:space-between; gap:8px; padding:calc(env(safe-area-inset-top) + 10px) 14px 10px; background:var(--teal); color:#fff; box-shadow:0 1px 0 rgba(0,0,0,.06); }
.topbar-title { font-weight:600; font-size:18px; }
.topbar-actions { display:flex; align-items:center; gap:8px; }
.chip { border:0; background:rgba(255,255,255,.16); color:#fff; padding:6px 10px; border-radius:999px; font-size:13px; cursor:pointer; }
.cogbtn { width:34px; height:34px; border-radius:50%; border:0; background:transparent; color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer; padding:0; -webkit-tap-highlight-color:transparent; }
.cogbtn:active { background:rgba(255,255,255,.16); }
.cogbtn svg { width:22px; height:22px; }
.datettl { display:inline-flex; align-items:center; gap:6px; background:transparent; border:0; color:#fff; font:inherit; font-weight:600; font-size:18px; cursor:pointer; padding:0; -webkit-tap-highlight-color:transparent; }
.datettl svg { width:19px; height:19px; flex:0 0 auto; }
.datettl .dtchev { font-size:12px; opacity:.85; transition:transform .15s; }
.datettl .dtchev.up { transform:rotate(180deg); }
.lang-toggle { display:inline-flex; background:rgba(255,255,255,.16); border-radius:999px; padding:2px; }
.lang-btn { border:0; background:transparent; color:#fff; opacity:.8; padding:5px 12px; border-radius:999px; font-weight:600; font-size:13px; cursor:pointer; }
.lang-btn.is-active { background:#fff; color:var(--teal); opacity:1; }
.status-strip { font-size:13px; padding:8px 14px; background:#fff8e1; color:var(--warn); border-bottom:1px solid var(--line); }
.status-strip.ok { background:#ecfdf3; color:var(--ok); }
.status-strip.err { background:#fef2f2; color:var(--err); }
.screen { padding:14px 14px 0; max-width:720px; margin:0 auto; }
.card { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:14px; margin-bottom:12px; }
.card h2 { font-size:15px; margin:0 0 10px; }
.muted { color:var(--muted); } .small { font-size:13px; }
.placeholder { text-align:center; color:var(--muted); padding:36px 12px; } .placeholder .big { font-size:40px; margin-bottom:8px; }
.grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
.stat { background:var(--chip); border-radius:12px; padding:10px; text-align:center; }
.stat .n { font-size:22px; font-weight:700; color:var(--teal-d); } .stat .k { font-size:11px; color:var(--muted); text-transform:uppercase; }
.kv { display:flex; justify-content:space-between; gap:10px; padding:5px 0; border-bottom:1px dashed var(--line); }
.kv:last-child { border-bottom:0; } .kv .k { color:var(--muted); } .kv .v { font-weight:600; text-align:right; }
/* ---- badge: the one status/count pill component. Base + semantic color modifiers + optional .lg size. ---- */
.badge { display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:700; padding:3px 9px; border-radius:var(--r-pill); white-space:nowrap; border:0; line-height:1.4; }
.badge.good { background:var(--ok-tint); color:var(--ok); }
.badge.watch { background:var(--warn-tint); color:var(--warn); }
.badge.alert { background:var(--err-tint); color:var(--err); }
.badge.info { background:var(--info-tint); color:var(--info); }
.badge.neutral { background:var(--chip); color:var(--muted); }
.badge.accent { background:var(--teal-tint); color:var(--teal-d); }
.badge.us { background:var(--us-tint); color:var(--us); }
.badge.autoimmune { background:#efe9fb; color:#5b3aa8; }
.badge.lg { font-size:13px; font-weight:600; padding:2px 10px; }
details.msgs { margin-top:8px; } details.msgs summary { cursor:pointer; font-size:13px; color:var(--muted); }
.msglist { margin:8px 0 0; padding:0; list-style:none; font-size:12px; } .msglist li { padding:4px 0; border-bottom:1px solid var(--line); color:var(--muted); }
.chips-row { display:flex; flex-wrap:wrap; gap:6px; }
.tabbar { position:fixed; left:0; right:0; bottom:0; z-index:10; height:calc(var(--tabbar-h) + env(safe-area-inset-bottom)); padding-bottom:env(safe-area-inset-bottom); display:grid; grid-template-columns:repeat(4,1fr); background:#fff; border-top:1px solid var(--line); }
.tabbar.us-on { grid-template-columns:repeat(5,1fr); }
.tab { border:0; background:transparent; cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; color:var(--muted); font-size:11px; }
.tab .tab-ico { font-size:20px; line-height:1; } .tab.is-active { color:var(--teal); font-weight:600; }
.tab.is-active[data-tab="us"] { color:var(--us); }
.tab[hidden] { display:none !important; }
.btn { border:0; background:var(--teal); color:#fff; border-radius:var(--r-md); padding:10px 14px; font-size:14px; font-weight:600; cursor:pointer; touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
.btn.ghost { background:var(--chip); color:var(--ink); } .btn.wide { width:100%; }
.btn-sm { border:1px solid var(--line); background:#fff; color:var(--err); border-radius:var(--r-sm); padding:5px 10px; font-size:13px; cursor:pointer; }
.subhead { font-size:12px; text-transform:uppercase; letter-spacing:.03em; color:var(--muted); margin:10px 0 6px; }
.saved-tag { text-align:center; padding:4px; } h2 .small { font-weight:400; text-transform:none; }
.daynav { display:flex; align-items:center; justify-content:space-between; gap:10px; } .daynav .dayname { text-align:center; flex:1; }
.daynav input[type="date"] { border:0; font-size:16px; font-weight:600; color:var(--ink); background:transparent; text-align:center; }
.navbtn { border:0; background:var(--chip); width:40px; height:40px; border-radius:50%; font-size:22px; color:var(--teal-d); cursor:pointer; } .navbtn:disabled { opacity:.35; }
.sym { padding:8px 0; border-bottom:1px solid var(--line); } .sym:last-child { border-bottom:0; } .sym.loc { padding-left:6px; }
.sym-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; } .sym-head.expandable { cursor:pointer; }
/* Group header is a <button> for keyboard access; strip the UA chrome so it matches the row it replaced. */
button.sym-head { background:none; border-left:0; border-right:0; border-bottom:0; width:100%; font:inherit; color:inherit; text-align:left; }
.sym-name { font-weight:600; } .located .loc-list { border-left:3px solid var(--chip); padding-left:10px; margin-top:4px; }
.sev-row { display:grid; grid-template-columns:repeat(5,1fr); gap:6px; }
.sev { border:1px solid var(--line); background:#fff; color:var(--muted); border-radius:9px; padding:9px 0; font-size:15px; font-weight:700; cursor:pointer; touch-action:manipulation; -webkit-tap-highlight-color:transparent; user-select:none; }
.sev.is-on { color:#fff; border-color:transparent; }
.sev-0.is-on,.sev-chip.sev-0 { background:var(--sev-0); color:var(--sev-0-ink); } .sev-1.is-on,.sev-chip.sev-1 { background:var(--sev-1); color:var(--sev-1-ink); }
.sev-2.is-on,.sev-chip.sev-2 { background:var(--sev-2); } .sev-3.is-on,.sev-chip.sev-3 { background:var(--sev-3); } .sev-4.is-on,.sev-chip.sev-4 { background:var(--sev-4); }
.sev-chip { display:inline-block; min-width:22px; text-align:center; color:#fff; border-radius:999px; padding:2px 9px; font-weight:700; font-size:13px; } .sev-chip .small { color:rgba(255,255,255,.85); }
.moodrow { display:grid; grid-template-columns:repeat(5,1fr); gap:6px; }
.mood { border:1px solid var(--line); background:#fff; border-radius:9px; padding:10px 0; display:flex; align-items:center; justify-content:center; cursor:pointer; touch-action:manipulation; -webkit-tap-highlight-color:transparent; user-select:none; }
.mood.is-on { border-width:2px; padding:9px 0; }
.mood svg { display:block; }
.moodnote { width:100%; margin-top:11px; border:1px solid var(--line); border-radius:8px; padding:8px; font:inherit; font-size:14px; line-height:1.45; resize:vertical; box-sizing:border-box; min-height:64px; max-height:240px; overflow-y:auto; }
.med { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:7px 0; border-bottom:1px solid var(--line); } .med:last-child { border-bottom:0; }
.med-name { font-weight:600; } .med-toggle { display:flex; gap:6px; }
.tgl { width:38px; height:38px; border:1px solid var(--line); background:#fff; border-radius:8px; font-size:15px; cursor:pointer; color:var(--muted); touch-action:manipulation; -webkit-tap-highlight-color:transparent; user-select:none; }
.tgl.is-yes { background:var(--ok); color:#fff; border-color:transparent; } .tgl.is-no { background:var(--err); color:#fff; border-color:transparent; }
.med-stepper { display:flex; align-items:center; gap:8px; }
.stepbtn { width:34px; height:34px; border:1px solid var(--line); background:#fff; border-radius:8px; font-size:17px; font-weight:700; line-height:1; cursor:pointer; color:var(--teal-d); touch-action:manipulation; -webkit-tap-highlight-color:transparent; user-select:none; }
.stepbtn.plus { background:var(--teal); color:#fff; border-color:transparent; }
.stepbtn:disabled { opacity:.35; cursor:default; }
.stepcount { min-width:22px; text-align:center; font-size:17px; font-weight:700; color:var(--teal-d); }
#noteBox { width:100%; border:1px solid var(--line); border-radius:var(--r-sm); padding:10px; font:inherit; resize:vertical; }
.ep-ongoing { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:6px 0; }
.ep-form { display:flex; flex-direction:column; gap:8px; } .ep-form input,.ep-form select { border:1px solid var(--line); border-radius:9px; padding:9px; font:inherit; }
.ep-form-row { display:grid; grid-template-columns:1fr 1fr; gap:8px; } .ep-form-actions { display:flex; gap:8px; }
.submit-block { margin-top:12px; padding-top:12px; border-top:1px solid var(--line); } .submit-hint { text-align:center; margin-top:6px; }
.row-right { display:inline-flex; align-items:center; gap:8px; flex-shrink:0; }
.ro-fold > summary { list-style:none; cursor:pointer; display:flex; align-items:center; gap:8px; }
.ro-fold > summary::-webkit-details-marker { display:none; }
.ro-fold > summary h2 { margin:0; }
.ro-caret { margin-left:auto; color:var(--muted); font-size:13px; transition:transform .15s; }
.ro-fold[open] .ro-caret { transform:rotate(90deg); }
.ro-body { margin-top:8px; }
.notebtn { border:1px solid var(--line); background:#fff; border-radius:8px; padding:3px 8px; font-size:13px; cursor:pointer; opacity:.55; }
.notebtn.has { opacity:1; border-color:var(--teal); background:#ecfeff; }
.rownote { width:100%; margin-top:8px; border:1px solid var(--line); border-radius:9px; padding:8px 34px 8px 8px; font:inherit; font-size:14px; resize:vertical; }
.rownote-wrap { margin-top:8px; position:relative; }
.rownote-wrap .rownote { margin-top:0; }
.rownote-done { position:absolute; top:6px; right:6px; width:24px; height:24px; display:inline-flex; align-items:center; justify-content:center; border:0; background:var(--teal); color:#fff; border-radius:50%; padding:0; cursor:pointer; touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
.rownote-done:active { opacity:.85; }
.appt-head { display:flex; align-items:center; justify-content:space-between; gap:10px; }
.appt-sp { font-size:18px; font-weight:700; color:var(--teal-d); }
.subtabs { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-bottom:12px; }
.subtab { border:1px solid var(--line); background:#fff; color:var(--muted); border-radius:var(--r-md); padding:9px; font-weight:600; cursor:pointer; }
.subtab.is-active { background:var(--teal-d); color:#fff; border-color:transparent; }
.bp-row { display:flex; align-items:flex-start; justify-content:space-between; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); }
.bp-row:last-child { border-bottom:0; }
.bp-name { font-weight:600; }
.q-row { display:flex; align-items:flex-start; justify-content:space-between; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); }
.q-row:last-child { border-bottom:0; }
.q-text { flex:1; }
ul.tight { margin: 4px 0 0; padding-left: 18px; } ul.tight li { padding: 1px 0; }
.lab-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; border: 0; background: transparent; border-bottom: 1px solid var(--line); padding: 10px 0; cursor: pointer; text-align: left; font: inherit; }
.lab-row:last-child { border-bottom: 0; }
.lab-val { color: var(--teal-d); font-weight: 600; white-space: nowrap; }
.chart { width: 100%; height: auto; margin-top: 8px; background: #fbfdfd; border: 1px solid var(--line); border-radius: 10px; }
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 50; }
.modal { background: #fff; border-radius: var(--r-lg); padding: 18px; max-width: 420px; width: 100%; }
.modal h2 { margin: 4px 0 8px; } .modal p { margin: 0 0 14px; }
.ed-btn { border:1px solid var(--line); background:#fff; border-radius:8px; padding:8px 10px; font-size:14px; cursor:pointer; color:var(--muted); touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
.addbtn { width:100%; margin-bottom:12px; }
.linkbtn { background:none; border:0; color:var(--teal); font:inherit; font-size:13px; text-decoration:underline; cursor:pointer; padding:6px; }
.linkbtn.danger { color:var(--err); font-weight:600; }
.modal-form { max-width:520px; max-height:88vh; display:flex; flex-direction:column; }
.form-body { overflow:auto; }
.f { margin-bottom:10px; } .f-label { font-size:12px; font-weight:600; color:var(--muted); margin-bottom:3px; }
.f input[type=text], .f input[type=number], .f input[type=date], .f select, .f textarea { width:100%; border:1px solid var(--line); border-radius:8px; padding:8px; font:inherit; }
.f-i18n { display:grid; grid-template-columns:auto 1fr; gap:4px 8px; align-items:center; } .f-i18n span { font-size:11px; color:var(--muted); }
.f-row label { display:flex; align-items:center; gap:8px; }
.f-chks { display:flex; flex-wrap:wrap; gap:6px 12px; } .f-chk { display:inline-flex; align-items:center; gap:4px; font-size:13px; }
.f-radios { display:flex; flex-direction:column; gap:2px; }
.f-radios .f-radio { display:flex; align-items:center; gap:10px; padding:9px 4px; font-size:15px; cursor:pointer; }
.f-radios .f-radio input { width:18px; height:18px; margin:0; flex:none; accent-color:var(--teal); }
.f-rowitem { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-bottom:6px; background:var(--chip); padding:6px; border-radius:8px; }
.f-rowitem input { flex:1 1 80px; border:1px solid var(--line); border-radius:6px; padding:6px; font:inherit; }
.form-actions { display:flex; align-items:center; gap:8px; margin-top:12px; padding-top:10px; border-top:1px solid var(--line); } .form-actions .spacer { flex:1; }
.medseg { display:inline-flex; flex-wrap:wrap; border:1px solid var(--line); border-radius:999px; padding:2px; margin:0 0 6px; }
.medseg button { border:0; background:none; font:inherit; font-size:13px; color:var(--muted); padding:6px 16px; border-radius:999px; cursor:pointer; -webkit-tap-highlight-color:transparent; touch-action:manipulation; }
.medseg button.on { background:var(--teal-d); color:#fff; font-weight:600; }

/* ---- feedback round 1 additions ---- */
.lab-dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:7px; vertical-align:middle; }
.lab-dot.lab-ok { background:var(--ok); } .lab-dot.lab-warn { background:var(--warn); } .lab-dot.lab-err { background:var(--err); }
.lab-trend { color:var(--muted); font-weight:700; }
.posneg { font-size:12px; font-weight:700; } .posneg-positive { color:var(--err); } .posneg-negative { color:var(--ok); }
.med .subhead, .card > .subhead:first-child { margin-top:0; }
.ep-ongoing-block { padding:6px 0; border-bottom:1px solid var(--line); } .ep-ongoing-block:last-child { border-bottom:0; }
.epnote { width:100%; margin-top:6px; border:1px solid var(--line); border-radius:8px; padding:7px; font:inherit; font-size:14px; resize:vertical; }
.tl-chev { margin-left:auto; color:var(--muted); font-size:18px; align-self:center; }
.sheet-bg { position:fixed; inset:0; background:rgba(0,0,0,.4); display:flex; align-items:flex-end; justify-content:center; z-index:50; }
.sheet { background:#fff; border-radius:var(--r-lg) var(--r-lg) 0 0; padding:16px 18px calc(20px + env(safe-area-inset-bottom)); width:100%; max-width:720px; box-shadow:0 -4px 24px rgba(0,0,0,.18); animation:sheetUp .18s ease-out; }
.sheet h2 { margin:6px 0 8px; } .sheet p { margin:0 0 14px; }
.sheet-handle { width:40px; height:4px; border-radius:999px; background:var(--line); margin:0 auto 12px; }
@keyframes sheetUp { from { transform:translateY(100%); } to { transform:translateY(0); } }

.daynav.past { background:#fff8e1; border-color:#f3e2b3; }
.daynav.past .dayname input[type="date"], .daynav.past .daysub { color:#92400e; }
.daynav.past .navbtn { background:#fff; border:1px solid #f3e2b3; color:#b45309; }
.sec-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
.sec-head h2 { margin:0; }
.symrow { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:7px 0; border-top:1px solid #eef1f3; }
.symrow.loc { padding:5px 0; }
.symrow-name { background:none; border:0; padding:0; font:inherit; font-weight:600; font-size:14px; color:var(--ink); text-align:left; cursor:pointer; flex:1; min-width:0; display:flex; align-items:center; gap:6px; }
.symrow .sev-row { flex:none; width:auto; display:flex; gap:4px; }
.symrow .sev { width:38px; padding:11px 0; font-size:14px; border-radius:8px; }
.symrow.loc .sev { width:34px; padding:10px 0; font-size:13px; }
.notedot { width:6px; height:6px; border-radius:50%; background:var(--teal); display:inline-block; }
.loc-list { border-left:2px solid var(--chip); padding-left:10px; margin:2px 0 2px 4px; }
.scale-foot { text-align:center; border-top:1px solid var(--line); padding-top:8px; margin-top:6px; font-size:11px; }
.scale-head { border-bottom:1px solid var(--line); padding-bottom:8px; margin-bottom:4px; font-size:11px; line-height:1.5; }
.med-group-label { font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--teal-d); font-weight:800; margin:9px 0 1px; }
.bp-med { display:flex; align-items:baseline; justify-content:space-between; gap:10px; padding:4px 0; border-top:1px solid #f4f6f7; }
.bp-med:first-of-type { border-top:0; }
.bp-med-name { font-weight:600; font-size:14px; }
.bp-med-dose { font-size:13px; color:var(--ink); text-align:right; }
.med-l { min-width:0; }
.med-sub { font-size:12px; color:var(--muted); margin-top:1px; }

// ---- Shared doctor-readable medication schedule (used by Prep + Records) ----
// Returns { xxx, freq }: an X-X-X dosing string (morning-midday-evening) plus a
// frequency label for anything that isn't a plain daily pattern.
const MED_FREQ_STR = {
  en: { prnLabel: 'PRN', everyOther: 'every other day', everyN: 'every {n} days',
        wd: { mon: 'Mon', tue: 'Tue', wed: 'Wed', thu: 'Thu', fri: 'Fri', sat: 'Sat', sun: 'Sun' } },
  es: { prnLabel: 'PRN', everyOther: 'días alternos', everyN: 'cada {n} días',
        wd: { mon: 'Lun', tue: 'Mar', wed: 'Mié', thu: 'Jue', fri: 'Vie', sat: 'Sáb', sun: 'Dom' } },
};
const MED_SLOT_BY_TIME = { morning: 0, midday: 1, evening: 2, bedtime: 2, prn: null };
function medUnitCount(dose) {
  // Use the leading number only when it's a tablet/capsule count, not a strength (mg/mcg).
  const mt = String(dose || '').match(/^(\d+(?:[.,]\d+)?)\s*(tabs?|tablets?|caps?|capsules?|pills?|puffs?|comp)\b/i);
  return mt ? parseFloat(mt[1].replace(',', '.')) : null;
}
function medNonTablet(m) { return /drop|spray|colirio|\bml\b/i.test(String(m.dose || '') + ' ' + (DL.tx(m.name, 'en') || '')); }
function medSchedule(m, lang) {
  const T = MED_FREQ_STR[lang] || MED_FREQ_STR.en;
  // Explicit override for patterns the structured model can't express.
  if (m.freqLabel && (m.freqLabel[lang] || m.freqLabel.en)) return { xxx: '', freq: m.freqLabel[lang] || m.freqLabel.en };
  const isPrn = m.scheduledDays === 'prn' || (m.status === 'prn' && m.everyNDays == null);
  if (isPrn) return { xxx: '', freq: T.prnLabel };
  // Stopped meds: no X-X-X. (Tapering meds still get an X-X-X; the "tapering off"
  // note is added by the caller, under the X-X-X.)
  if (m.status === 'stopped') return { xxx: '', freq: '' };
  // Eye drops / sprays don't map onto an X-X-X tablet grid.
  if (medNonTablet(m)) return { xxx: '', freq: '' };
  const slot = MED_SLOT_BY_TIME[m.timeOfDay || 'morning'];
  const n = medUnitCount(m.dose) || 1;
  const cells = [0, 0, 0]; if (slot != null) cells[slot] = n;
  const fmtN = (x) => Number.isInteger(x) ? String(x) : String(x).replace('.', lang === 'es' ? ',' : '.');
  const xxx = cells.map(fmtN).join('-');
  let freq = '';
  if (m.everyNDays != null) { freq = m.everyNDays === 2 ? T.everyOther : T.everyN.replace('{n}', m.everyNDays); }
  else if (Array.isArray(m.scheduledDays) && m.scheduledDays.length && m.scheduledDays.length < 7) { freq = m.scheduledDays.map((d) => (T.wd[d] || d)).join('/'); }
  return { xxx, freq };
}

  const resolvedConds = allConds.filter((c) => c.status === 'resolved');
  const conds = activeConds.map(condRow).join('') || `<p class="muted small">${T.none}</p>`;
  const resolvedRows = resolvedConds.map(condRow).join('') || `<p class="muted small">${T.none}</p>`;
  // Doctor-style med list: Regular / Supplements / PRN with an aligned schedule column.
  const isPrnMed = (m) => m.scheduledDays === 'prn' || (m.status === 'prn' && m.everyNDays == null);
  const medRowHtml = (m) => {
    const sch = medSchedule(m, lang);
    let statusLbl = '';
    if (m.status && m.status !== 'active' && !isPrnMed(m)) {
      statusLbl = (T.medStatus && T.medStatus[m.status]) || m.status;
    }
    let right;
    if (sch.xxx) { const sub = [sch.freq, statusLbl].filter(Boolean).join(' · '); right = `${esc(sch.xxx)}${sub ? `<span class="f">${esc(sub)}</span>` : ''}`; }
    else { right = `<span class="f">${esc(sch.freq || statusLbl)}</span>`; }
    const tag = tx(m.purpose, lang) || '';
    const sub = (tag ? esc(tag) : '') + (tag && m.dose ? ' · ' : '') + (m.dose ? `<b>${esc(m.dose)}</b>` : '');
    const spIds = (m.specialismIds && m.specialismIds.length) ? m.specialismIds : [...new Set((m.conditionIds || []).flatMap((cid) => (condById[cid]?.specialismIds) || []))];
    const spNames = spIds.map((sid) => spById[sid] ? specialistLabel(spById[sid], lang) : '').filter(Boolean);
    const specLine = spNames.length ? `<div class="dmeta dspec">${esc(spNames.join(', '))}</div>` : '';
    return `<div class="drow"><div><div class="dname">${esc(tx(m.name, lang))}</div>${sub ? `<div class="dmeta">${sub}</div>` : ''}${specLine}</div><div class="dright"><div class="sched">${right}</div></div></div>`;
  };
  const byTimeOfDay = (a, b) => ((TOD_ORDER[a.timeOfDay] != null ? TOD_ORDER[a.timeOfDay] : 1) - (TOD_ORDER[b.timeOfDay] != null ? TOD_ORDER[b.timeOfDay] : 1));
  const allMeds = bp.medications;
  const asNeededMeds = allMeds.filter((m) => isPrnMed(m) || m.category === 'therapy');
  const suppMeds = allMeds.filter((m) => !isPrnMed(m) && m.category === 'supplement').sort(byTimeOfDay);
  const regMeds = allMeds.filter((m) => !isPrnMed(m) && m.category !== 'supplement' && m.category !== 'therapy').sort(byTimeOfDay);
  const medSection = (label, list) => list.length ? `<div class="subsec">${label}</div>${list.map(medRowHtml).join('')}` : '';
  const meds = (medSection(T.secRegular, regMeds) + medSection(T.secSupplements, suppMeds) + medSection(T.secPrn, asNeededMeds)) || `<p class="muted small">${T.none}</p>`;
  // Ruled out — one collapsed line; each item taps for why/when.
  const roItem = (r) => {
    const prov = r.status === 'provisionally_excluded';
    const reason = tx(r.reason, lang);
    const revisit = r.revisitNote ? tx(r.revisitNote, lang) : '';
    const why = [reason, revisit ? ('↺ ' + revisit) : ''].filter(Boolean).join(' — ');
    return `<details class="ro"><summary><span class="badge ${prov ? 'info' : 'neutral'}">${esc(tx(r.name, lang))}${prov ? ' ↺' : ''}</span><span class="muted small">${r.date ? fmtDate(r.date, lang) : ''} ›</span></summary><div class="ro-why">${esc(why || '—')}</div></details>`;
  };
  const ro = bp.excluded.map(roItem).join('') || `<p class="muted small">${T.none}</p>`;
  // One ✎ per card opens a list to pick which item to edit (instead of a pencil on every row).
  const editHint = lang === 'es' ? 'Elige cuál editar:' : 'Choose which to edit:';
  const pickList = (items, coll, nameFn) => `<div class="muted small" style="margin:2px 0 6px">${editHint}</div>` + (items.length ? items.map((it) => `<button class="pickrow" data-edit="${coll}:${it.id}">${esc(nameFn(it))}</button>`).join('') : `<p class="muted small">${T.none}</p>`);
  const editBtn = (coll) => `<button class="addmini" data-editpick="${coll}" aria-label="${lang === 'es' ? 'Editar' : 'Edit'}">${ui.editPick === coll ? '✕' : '✎'}</button>`;
  // Conditions + Ruled out share one card with a toggle (single column). Row contents/tags are unchanged.
  const condView = ui.condView || 'active';
  const condSeg = `<div class="seg"><button class="${condView === 'active' ? 'on' : ''}" data-condview="active">${lang === 'es' ? 'Activas' : 'Active'} · ${activeConds.length}</button><button class="${condView === 'resolved' ? 'on' : ''}" data-condview="resolved">${lang === 'es' ? 'Historial' : 'History'} · ${resolvedConds.length}</button><button class="${condView === 'ruled' ? 'on' : ''}" data-condview="ruled">${T.ruledOut} · ${bp.excluded.length}</button></div>`;
  const condHdr = condView === 'ruled'
    ? `${editBtn('excluded')}<button class="addmini" data-add="conditions" data-prefill='{"status":"excluded"}' aria-label="${lang === 'es' ? 'Añadir descartado' : 'Add ruled-out'}">＋</button>`
    : `${editBtn('conditions')}<button class="addmini" data-add="conditions" aria-label="Add condition">＋</button>`;
  const condBody = condView === 'ruled'
    ? (ui.editPick === 'excluded' ? pickList(bp.excluded, 'conditions', (r) => tx(r.name, lang)) : ro)
    : condView === 'resolved'
      ? (ui.editPick === 'conditions' ? pickList(resolvedConds, 'conditions', (c) => tx(c.name, lang)) : resolvedRows)
      : (ui.editPick === 'conditions' ? pickList(activeConds, 'conditions', (c) => tx(c.name, lang)) : conds);
  // Past (stopped) meds — hidden from the current list, surfaced here so they can be reopened / resumed.
  const pastMeds = (data.medications || []).filter((m) => m.status === 'stopped').sort((a, b) => { const x = a.stopDate || '', y = b.stopDate || ''; return x < y ? 1 : (x > y ? -1 : 0); });
  const pastLbl = lang === 'es' ? 'Medicamentos anteriores' : 'Past medications';
  const stoppedLbl = lang === 'es' ? 'suspendido' : 'stopped';
  const pastRows = pastMeds.map((m) => `<button class="pickrow" data-edit="medications:${m.id}">${esc(tx(m.name, lang))}${m.stopDate ? ` <span class="muted small">· ${stoppedLbl} ${fmtDate(m.stopDate, lang)}</span>` : ''}</button>`).join('');
  const pastSection = pastMeds.length ? `<details class="pastmeds" style="margin-top:10px;border-top:1px solid var(--line);padding-top:8px"><summary style="cursor:pointer;color:var(--muted);font-size:13px">${pastLbl} · ${pastMeds.length}</summary><div style="margin-top:6px">${pastRows}</div></details>` : '';
  // Med edit mode: non-as-needed meds stay tap-to-edit; the as-needed group becomes a drag-to-reorder
  // list (grips), since those have no time-of-day and their Summary order follows the data array.
  const medEditRow = (m) => `<button class="pickrow" data-edit="medications:${m.id}">${esc(tx(m.name, lang))}${m.dose ? ` <span class="muted small">${esc(m.dose)}</span>` : ''}</button>`;
  const asNeededIds = new Set(asNeededMeds.map((m) => m.id));
  const editRest = (data.medications || []).filter((m) => m.status !== 'stopped' && !asNeededIds.has(m.id));
  const medReoRow = (m) => `<div class="pickrow-wrap" data-medid="${m.id}"><span class="drag-grip" aria-hidden="true" title="${lang === 'es' ? 'Arrastra para reordenar' : 'Drag to reorder'}">⠿</span>${medEditRow(m)}</div>`;
  const reoHint = lang === 'es' ? 'Arrastra ⠿ para reordenar' : 'Drag ⠿ to reorder';
  const medEditBody = `<div class="muted small" style="margin:2px 0 6px">${editHint}</div>`
    + editRest.map(medEditRow).join('')
    + (asNeededMeds.length ? `<div class="subsec">${T.secPrn}</div><div class="muted small" style="margin:0 0 6px">${reoHint}</div><div id="medReorder" class="sym-reorder">${asNeededMeds.map(medReoRow).join('')}</div>` : '')
    + ((!editRest.length && !asNeededMeds.length) ? `<p class="muted small">${T.none}</p>` : '');
  const condInfoBtn = `<button class="infobtn" data-condinfo aria-label="${T.condInfoAria}"><svg viewBox="0 0 24 24" width="13" height="13" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="7.5" r="1.4" fill="currentColor"/><rect x="10.8" y="10.5" width="2.4" height="7" rx="1.2" fill="currentColor"/></svg></button>`;
  const condInfoModal = ui.condInfoOpen ? `<div class="modal-bg" data-condinfobg><div class="modal sym-info" role="dialog" aria-label="${T.condInfoAria}">
      <div class="sym-info-top"><button class="sym-info-x" data-condinfoclose aria-label="✕">✕</button></div>
      <h2 class="sym-info-title">${T.condInfoTitle}</h2>
      <div class="condinfo-legend">
        <div class="condinfo-row"><span class="badge autoimmune">${T.autoimmune}</span><span>${T.condInfoAi}</span></div>
        <div class="condinfo-row"><span class="condinfo-bar"></span><span>${T.condInfoAdj}</span></div>
      </div>
    </div></div>` : '';
  return `<div class="ds">
    <div class="card"><div class="card-h"><span class="hgrp"><h2>${T.activeManaged}</h2>${condInfoBtn}</span><span class="hgrp">${condHdr}</span></div>${condSeg}${condBody}</div>
    <div class="card" id="medsTable"><div class="card-h"><h2>${T.currentMeds}</h2><span class="hgrp">${editBtn('medications')}<button class="addmini" data-add="medications" aria-label="Add medication">＋</button></span></div>${ui.editPick === 'medications' ? medEditBody : meds}${pastSection}</div>
    ${Records.renderLabs(state)}
    ${Records.renderProg(state)}
    <button class="printbtn" data-print><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>${lang === 'es' ? 'Imprimir / Guardar PDF' : 'Print / Save PDF'}</button>
  </div>${condInfoModal}`;
}

function renderQuestions(state) {
  const lang = state.lang; const T = STR[lang]; const data = DL.getData();
  const todayStr = new Date().toLocaleDateString('en-CA');
  const specs = (data.specialisms || []);
  const spName = (id) => { const s = specs.find((x) => x.id === id); return s ? specialistLabel(s, lang) : ''; };
  const spDr = (id) => { const s = specs.find((x) => x.id === id); return (s && s.doctor) ? s.doctor : ''; };
  const appts = (data.appointments || []);
  const upcoming = appts.filter((a) => a.date >= todayStr && !a.attended).sort((a, b) => (a.date < b.date ? -1 : 1));
  const past = appts.filter((a) => a.date < todayStr || a.attended).sort((a, b) => (a.date < b.date ? 1 : -1));
  const next = upcoming[0] || null;
  const L = (en, es) => lang === 'en' ? en : es;
  // --- Next-appointment hero ---
  let hero = '';
  if (next) {
    const days = Math.round((new Date(next.date + 'T00:00:00') - new Date(todayStr + 'T00:00:00')) / 86400000);
    const cd = days <= 0 ? L('today', 'hoy') : days === 1 ? L('tomorrow', 'mañana') : L(`in ${days} days`, `en ${days} días`);
    hero = `<div class="vhero"><div class="vlbl">${L('Next appointment', 'Próxima cita')}</div><div class="vwhen">${fmtDate(next.date, lang)}${next.time ? ` · ${esc(next.time)}` : ''}</div><div class="vwho">${esc(spName(next.specialismId))}${spDr(next.specialismId) ? ` · ${esc(spDr(next.specialismId))}` : ''}</div><div class="vhero-foot"><span class="vcd">${cd}</span><button class="vdone" data-pvopen="${next.id}">✓ ${L('Mark done', 'Marcar hecha')}</button></div></div>`;
  }
  // --- Upcoming (rest after next) ---
  const editHint = lang === 'es' ? 'Elige cuál editar:' : 'Choose which to edit:';
  const pickList = (items, coll, nameFn) => `<div class="muted small" style="margin:2px 0 6px">${editHint}</div>` + (items.length ? items.map((it) => `<button class="pickrow" data-edit="${coll}:${it.id}">${esc(nameFn(it))}</button>`).join('') : `<p class="muted small">${T.none}</p>`);
  const editBtn = (coll) => `<button class="addmini" data-editpick="${coll}" aria-label="${lang === 'es' ? 'Editar' : 'Edit'}">${ui.editPick === coll ? '✕' : '✎'}</button>`;
  const apptName = (a) => `${fmtDate(a.date, lang)}${a.time ? ' · ' + a.time : ''} — ${spName(a.specialismId)}`;
  const restUp = upcoming.slice(1);
  // Appointment cell: date · time + specialist. Past cells with a note are tappable to reveal it inline.
  const apptCell = (a, isPast) => {
    const when = `${fmtDate(a.date, lang)}${a.time ? ` · ${esc(a.time)}` : ''}`;
    const who = esc(spName(a.specialismId)); const note = tx(a.note, lang);
    if (isPast && note) {
      const open = ui.apptNotesOpen.has(a.id);
      return `<div class="appt-cell"><button class="appt-tap" data-apptnote="${a.id}"><div class="dname">${when}</div><div class="dmeta">${who} <span class="appt-notechev">${open ? '▾' : '▸'}</span></div></button>${open ? `<div class="appt-note muted small">${esc(note)}</div>` : ''}</div>`;
    }
    return `<div class="appt-cell"><div class="dname">${when}</div><div class="dmeta">${who}</div></div>`;
  };
  const apptList = (items, isPast) => items.length ? `<div class="appt-cols">${items.map((a) => apptCell(a, isPast)).join('')}</div>` : `<p class="muted small">${isPast ? L('No past appointments', 'Sin citas pasadas') : L('Nothing else scheduled', 'Nada más programado')}</p>`;
  const apptView = past.length ? (ui.apptView || 'upcoming') : 'upcoming';
  const apptSeg = past.length ? `<div class="appt-seg"><button class="${apptView === 'upcoming' ? 'on' : ''}" data-apptview="upcoming">${L('Upcoming', 'Próximas')} · ${restUp.length}</button><button class="${apptView === 'past' ? 'on' : ''}" data-apptview="past">${L('Past', 'Pasadas')} · ${past.length}</button></div>` : '';
  const apptBody = apptView === 'past' ? apptList(past, true) : apptList(restUp, false);
  const apptCard = `<div class="card"><div class="card-h"><h2>${L('Appointments', 'Citas')}</h2><span class="hgrp">${editBtn('appointments')}<button class="addmini" data-add="appointments" aria-label="Add appointment">＋</button></span></div>${ui.editPick === 'appointments' ? pickList(upcoming.concat(past), 'appointments', apptName) : `${apptSeg}${apptBody}`}</div>`;
  // --- Questions: grouped by specialist, next-visit specialist first ---
  const openAll = (data.questions || []).filter((q) => q.status === 'open');
  const answeredAll = (data.questions || []).filter((q) => q.status === 'answered');
  const qName = (q) => esc(tx(q.text, lang));
  const aNote = (q) => (q.answerNote && (q.answerNote[lang] || q.answerNote.en)) || '';
  const qRow = (q) => {
    if (ui.answering === q.id) {
      const note = (q.answerNote && q.answerNote[lang]) || '';
      return `<div class="qrow answering"><div class="qtext">${qName(q)}</div><textarea class="q-note" data-qnote="${q.id}" rows="2" placeholder="${T.answerNotePh}">${esc(note)}</textarea><button class="btn q-continue" data-continue="${q.id}">${T.cont}</button></div>`;
    }
    return `<div class="qrow"><button class="qtick" data-answer="${q.id}" aria-label="${T.markAnswered}"></button><div class="qtext">${qName(q)}</div><button class="ed-btn2" data-edit="questions:${q.id}" aria-label="Edit">✎</button></div>`;
  };
  const answeredFold = (ans) => `<details class="q-answered"><summary><span class="ro-caret">▶</span> ${L('Answered', 'Respondidas')} (${ans.length})</summary><div class="q-answered-body">${ans.map((q) => `<div class="qrow answered"><div class="qtext">${qName(q)}${aNote(q) ? `<div class="qanote muted small">${esc(aNote(q))}</div>` : ''}</div><button class="ed-btn2" data-edit="questions:${q.id}" aria-label="Edit">✎</button></div>`).join('')}</div></details>`;
  // Questions are collapsed per specialist (tap the name to expand). Open state lives in ui.qExpanded so it survives re-renders; next-visit specialist starts open.
  if (ui.qExpanded === null) ui.qExpanded = new Set(next ? [next.specialismId] : []);
  const addQBtn = (id) => `<button class="linkbtn" data-add="questions" data-prefill='${esc(JSON.stringify({ specialismId: id }))}' style="margin:6px 0 2px 4px">+ ${L('Add question', 'Añadir pregunta')}</button>`;
  const qGroup = (id, title, qs, ans) => {
    const open = ui.qExpanded.has(id);
    const body = open ? `<div class="qg-body">${qs.map(qRow).join('')}${ans && ans.length ? answeredFold(ans) : ''}${id === '__orphans' ? '' : addQBtn(id)}</div>` : '';
    return `<div class="qg"><button class="qg-sum" data-qexpand="${id}"><span class="qgroup-t">${title}</span><span class="badge neutral qg-count">${qs.length}</span><span class="qg-caret">${open ? '▾' : '▶'}</span></button>${body}</div>`;
  };
  const order = next ? [next.specialismId, ...specs.map((s) => s.id).filter((id) => id !== next.specialismId)] : specs.map((s) => s.id);
  let groups = '';
  order.forEach((id) => {
    const qs = openAll.filter((q) => q.specialismId === id);
    const ans = answeredAll.filter((q) => q.specialismId === id);
    if (!qs.length && !ans.length) return;
    const isNext = next && id === next.specialismId;
    groups += qGroup(id, `${esc(spName(id))}${isNext ? ` · ${L('next visit', 'próxima visita')}` : ''}`, qs, ans);
  });
  const orphans = openAll.filter((q) => !specs.some((s) => s.id === q.specialismId));
  if (orphans.length) groups += qGroup('__orphans', T.other, orphans, []);
  const qCard = `<div class="card"><div class="card-h"><h2>${L('Questions to ask', 'Preguntas para preguntar')}</h2><button class="addmini" data-add="questions" aria-label="Add question">＋</button></div>${groups || `<p class="muted small">${T.noQuestionsAll}</p>`}</div>`;
  // --- Care team (always exposed; editing folded in here) ---
  const ctSpecs = specs.slice().sort((a, b) => specialistLabel(a, lang).localeCompare(specialistLabel(b, lang), lang === 'es' ? 'es' : 'en'));
  const ct = `<div class="ct-grid">${ctSpecs.map((s) => `<div class="ct-cell"><div class="dname">${esc(specialistLabel(s, lang))}</div>${s.doctor ? `<div class="dmeta">${esc(s.doctor)}</div>` : ''}</div>`).join('')}</div>`;
  const careCard = `<div class="card"><div class="card-h"><h2>${L('Care team', 'Equipo médico')}</h2><span class="hgrp">${editBtn('specialisms')}<button class="addmini" data-add="specialisms" aria-label="Add specialist">＋</button></span></div>${ui.editPick === 'specialisms' ? pickList(ctSpecs, 'specialisms', (s) => specialistLabel(s, lang)) : ct}</div>`;
  // --- Post-visit sheet (Mark done flow) ---
  let pvModal = '';
  if (ui.postVisit) {
    const a = appts.find((x) => x.id === ui.postVisit);
    if (a) {
      const sp = a.specialismId;
      const noteEn = (a.note && a.note.en) || '';
      const openQs = (data.questions || []).filter((q) => q.status === 'open' && q.specialismId === sp);
      const qChecks = openQs.length ? openQs.map((q) => `<label class="pv-check"><input type="checkbox" data-pvq="${q.id}"><span>${qName(q)}</span></label>`).join('') : `<p class="muted small">${L('No open questions for this specialist.', 'Sin preguntas abiertas para este especialista.')}</p>`;
      pvModal = `<div class="modal-bg" data-pvcancelbg><div class="modal" role="dialog">
        <h2 style="margin:0 0 2px">${esc(spName(sp))} — ${fmtDate(a.date, lang)}</h2>
        ${spDr(sp) ? `<div class="muted small" style="margin-bottom:12px">${esc(spDr(sp))}</div>` : '<div style="height:8px"></div>'}
        <div class="f-label">${L('What came out of it?', '¿Qué resultó de la cita?')}</div>
        <textarea id="pvNote" class="q-note" rows="3" placeholder="${L('Decisions, results, next steps…', 'Decisiones, resultados, próximos pasos…')}">${esc(noteEn)}</textarea>
        <div class="f-label" style="margin-top:14px">${L('Questions you raised — tick what you covered', 'Preguntas planteadas — marca las que cubriste')}</div>
        <div class="pv-checks">${qChecks}</div>
        <div class="f-label" style="margin-top:14px">${L('New follow-ups (one per line)', 'Nuevos seguimientos (uno por línea)')}</div>
        <textarea id="pvFollow" class="q-note" rows="2" placeholder="${L('e.g. Chase biopsy results if none by 10 Jul', 'p. ej. reclamar biopsia si no llega para 10 jul')}"></textarea>
        <div class="form-actions" style="margin-top:16px"><span class="spacer"></span><button class="btn ghost" data-pvcancel>${L('Cancel', 'Cancelar')}</button><button class="btn" data-pvsave="${a.id}">${L('Save & archive visit', 'Guardar y archivar')}</button></div>
      </div></div>`;
    }
  }
  return `<div class="ds">${hero}${apptCard}${qCard}${careCard}</div>${pvModal}`;
}

async function onClick(e, state, rerender) {
  const bg = e.target.closest('[data-pvcancelbg]');
  if (bg && e.target === bg) { ui.postVisit = null; rerender(); return; }
  const cib = e.target.closest('[data-condinfobg]');
  if (cib && e.target === cib) { ui.condInfoOpen = false; rerender(); return; }
  const t = e.target.closest('button');
  if (!t) return;
  if (t.dataset.condinfo != null) { ui.condInfoOpen = true; rerender(); return; }
  if (t.dataset.condinfoclose != null) { ui.condInfoOpen = false; rerender(); return; }
  if (t.dataset.print != null) { printDoctorSheet(state.lang); return; }
  if (t.dataset.pvopen != null) { ui.postVisit = t.dataset.pvopen; rerender(); return; }
  if (t.dataset.pvcancel != null) { ui.postVisit = null; rerender(); return; }
  if (t.dataset.pvsave != null) {
    const a = DL.getRecord('appointments', t.dataset.pvsave);
    if (a) {
      const todayStr = new Date().toLocaleDateString('en-CA');
      const noteEl = document.getElementById('pvNote');
      if (noteEl) { a.note = a.note || { en: '', es: '' }; a.note.en = noteEl.value; }
      document.querySelectorAll('[data-pvq]:checked').forEach((cb) => DL.markQuestionAnswered(cb.dataset.pvq));
      const followEl = document.getElementById('pvFollow');
      if (followEl) followEl.value.split('\n').map((s) => s.trim()).filter(Boolean).forEach((line) => DL.upsert('questions', { text: { en: line, es: '' }, specialismId: a.specialismId, conditionIds: [], status: 'open', createdDate: todayStr, answerNote: { en: '', es: '' } }));
      a.attended = true; a.attendedDate = todayStr;
      await DL.persist();
    }
    ui.postVisit = null; rerender(); return;
  }

    ? '<button id="odSignOut" class="btn ghost">Sign out</button><button id="odSync" class="btn">Sync now</button>'
    : '<button id="odSignIn" class="btn">Sign in with Microsoft</button>') : '';

    '<p class="muted small">' + status + '</p>' +
    '<div class="f"><div class="f-label">Microsoft Client ID</div><input id="odClientId" type="text" value="' + esc(OneDrive.getClientId()) + '" placeholder="paste the Application (client) ID"></div>' +

function registerSW() {
  // Skip the service worker on local dev (localhost/127.0.0.1). The SW caches the whole app
  // shell (network-first, cache-fallback), which fights local preview servers — especially

  // leaves you looking at a stale shell. Off on localhost = plain static previews just work.
  const host = location.hostname;
